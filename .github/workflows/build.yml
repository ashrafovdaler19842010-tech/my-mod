name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Unzip template
        run: unzip -o mod.zip || true

      - name: Configure Project & Copy Sources
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
              id 'maven-publish'
          }

          version = "1.0.0"
          group = "com.auctionbot"

          base {
              archivesName = "auctionbot"
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.8"
              mappings "net.fabricmc:yarn:1.21.8+build.1:v2"
              modImplementation "net.fabricmc:fabric-loader:0.16.14"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.8"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          jar {
              from("LICENSE") {
                  rename { "${it}_${project.base.archivesName.get()}"}
              }
          }
          EOF

          rm -rf src/main/java/*
          mkdir -p src/main/java/com/auctionbot/mixin
          mkdir -p src/main/resources

          cp BotConfig.java PriceParser.java MarketScanner.java AuctionSniper.java BotConfigScreen.java AuctionBotClient.java src/main/java/com/auctionbot/
          cp ClientPlayNetworkHandlerMixin.java src/main/java/com/auctionbot/mixin/

          cat << 'EOF' > src/main/resources/auctionbot.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.auctionbot.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "ClientPlayNetworkHandlerMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "auctionbot",
            "version": "1.0.0",
            "name": "AuctionBot",
            "description": "Auto market scanner and auction sniper for 1.21.8",
            "authors": ["ashrafovdaler19842010-tech"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.auctionbot.AuctionBotClient"
              ]
            },
            "mixins": [
              "auctionbot.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.8",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Build with Gradle
        run: gradle build --no-daemon --no-configuration-cache

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: AuctionBot-1.21.8
          path: build/libs/*.jar
