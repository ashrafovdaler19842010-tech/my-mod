name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.GrimBypassClient/g' src/main/resources/fabric.mod.json
          
          # Access Widener (Для noJumpDelay)
          cat << 'EOF' > src/main/resources/template-mod.accesswidener
          accessWidener v2 named
          accessible field net/minecraft/world/entity/LivingEntity noJumpDelay I
          EOF
          
          if ! grep -q "accessWidener" src/main/resources/fabric.mod.json; then
            sed -i 's/"entrypoints": {/"accessWidener": "template-mod.accesswidener",\n  "entrypoints": {/g' src/main/resources/fabric.mod.json
          fi
          
          if ! grep -q "accessWidenerPath" build.gradle; then
            sed -i '1s/^/loom { accessWidenerPath = file("src\/main\/resources\/template-mod.accesswidener") }\n/' build.gradle
          fi

          # Миксины
          cat << 'EOF' > src/client/resources/template-mod.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "ConnectionMixin",
              "LivingEntityMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client/mixin
          
          # КОНФИГ
          cat << 'EOF' > src/client/java/com/example/client/GrimConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class GrimConfig {
              private static final File FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "grim-bypass.json");
              public int mode = 0; 
              public boolean enabled = false;

              public static GrimConfig INSTANCE = new GrimConfig();

              public static void save() {
                  try (FileWriter w = new FileWriter(FILE)) { new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, w); } catch (Exception ignored) {}
              }
              public static void load() {
                  if (FILE.exists()) {
                      try (FileReader r = new FileReader(FILE)) {
                          GrimConfig l = new Gson().fromJson(r, GrimConfig.class);
                          if (l != null) INSTANCE = l;
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # MIXIN: BLINK (Буферизация пакетов)
          cat << 'EOF' > src/client/java/com/example/client/mixin/ConnectionMixin.java
          package com.example.client.mixin;

          import com.example.client.GrimConfig;
          import net.minecraft.network.Connection;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          import java.util.ArrayList;
          import java.util.List;

          @Mixin(Connection.class)
          public class ConnectionMixin {
              private static final List<Packet<?>> buffer = new ArrayList<>();
              private static int packetCount = 0;
              private static long lastFlush = 0;

              @Inject(method = "send(Lnet/minecraft/network/protocol/Packet;)V", at = @At("HEAD"), cancellable = true)
              private void onSend(Packet<?> packet, CallbackInfo ci) {
                  // Режимы 0 и 1 (Blink)
                  if (GrimConfig.INSTANCE.enabled && (GrimConfig.INSTANCE.mode == 0 || GrimConfig.INSTANCE.mode == 1)) {
                      if (packet instanceof ServerboundMovePlayerPacket) {
                          buffer.add(packet);
                          packetCount++;
                          
                          // Лимит буфера: 3 тика (150мс) или 5 тиков (250мс) в зависимости от режима
                          int limit = GrimConfig.INSTANCE.mode == 0 ? 3 : 6;
                          
                          if (packetCount >= limit) {
                              // Выпускаем пачку (Grim обработает их по очереди)
                              for (Packet<?> p : buffer) {
                                  ((Connection)(Object)this).send(p);
                              }
                              buffer.clear();
                              packetCount = 0;
                          }
                          ci.cancel(); // Отменяем одиночную отправку
                      }
                  } else if (!buffer.isEmpty()) {
                      // Если Blink выключили, сбрасываем остатки
                      for (Packet<?> p : buffer) ((Connection)(Object)this).send(p);
                      buffer.clear();
                      packetCount = 0;
                  }
              }
          }
          EOF

          # MIXIN: HEAD-HITTING (Сброс задержки прыжка)
          cat << 'EOF' > src/client/java/com/example/client/mixin/LivingEntityMixin.java
          package com.example.client.mixin;

          import com.example.client.GrimConfig;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(LivingEntity.class)
          public class LivingEntityMixin {
              @Inject(method = "aiStep", at = @At("HEAD"))
              private void onAiStep(CallbackInfo ci) {
                  if (GrimConfig.INSTANCE.enabled && (GrimConfig.INSTANCE.mode == 2 || GrimConfig.INSTANCE.mode == 3)) {
                      if ((Object)this instanceof Player player) {
                          // Обнуляем задержку прыжка для Head-Hitting и Spider
                          player.noJumpDelay = 0;
                      }
                  }
              }
          }
          EOF

          # ГЛАВНЫЙ КЛАСС
          cat << 'EOF' > src/client/java/com/example/client/GrimBypassClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.sounds.SoundEvents;
          import org.lwjgl.glfw.GLFW;

          public class GrimBypassClient implements ClientModInitializer {
              private static boolean xKeyWasDown = false;
              private static boolean rCtrlWasDown = false;
              private static int tickTimer = 0;

              @Override
              public void onInitializeClient() {
                  GrimConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      tickTimer++;

                      // Right Ctrl - Меню
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof GrimScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new GrimScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // X - Вкл/Выкл
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown && client.screen == null) {
                          GrimConfig.INSTANCE.enabled = !GrimConfig.INSTANCE.enabled;
                          client.player.playSound(GrimConfig.INSTANCE.enabled ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
                          GrimConfig.save();
                      }
                      xKeyWasDown = xDown;

                      if (!GrimConfig.INSTANCE.enabled || client.screen != null) return;

                      // Логика Head-Hitting (Режим 2)
                      if (GrimConfig.INSTANCE.mode == 2) {
                          // Если над головой блок (2 блока вверх)
                          if (client.level.getBlockState(client.player.blockPosition().above(2)).isSolid() && client.player.onGround()) {
                              // Дискретное нажатие (симуляция отпускания и нажатия)
                              client.options.keyJump.setDown(false);
                              if (tickTimer % 2 == 0) {
                                  client.options.keyJump.setDown(true);
                              }
                          }
                      } 
                      // Spider (Режим 3)
                      else if (GrimConfig.INSTANCE.mode == 3) {
                          if (client.player.horizontalCollision && client.options.keyJump.isDown()) {
                              // Спамим прыжком только когда жмем пробел у стены
                              if (tickTimer % 3 == 0) client.player.jumpFromGround();
                          }
                      }
                  });
              }
          }
          EOF

          # МЕНЮ
          cat << 'EOF' > src/client/java/com/example/client/GrimScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class GrimScreen extends Screen {
              public GrimScreen() { super(Component.literal("Grim Bypasses")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  int x = this.width / 2 - 120;
                  int y = this.height / 2 - 70;
                  String[] names = {
                      "Blink 150ms (Safe)",
                      "Blink 300ms (Risky)",
                      "Head-Hitting (Auto)",
                      "Spider (Wall Climb)"
                  };

                  for (int i = 0; i < 4; i++) {
                      final int mode = i;
                      String btnText = (GrimConfig.INSTANCE.mode == i ? "§a" : "§7") + names[i];
                      this.addRenderableWidget(Button.builder(Component.literal(btnText), b -> {
                          GrimConfig.INSTANCE.mode = mode;
                          GrimConfig.save();
                          this.init();
                      }).bounds(x, y + (i * 25), 240, 20).build());
                  }
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  context.drawCenteredString(this.font, "§l§bGrim/Polar Bypasses", this.width / 2, this.height / 2 - 90, 0xFFFFFF);
                  context.drawCenteredString(this.font, "§7Status: " + (GrimConfig.INSTANCE.enabled ? "§aENABLED" : "§cDISABLED"), this.width / 2, this.height / 2 - 75, 0xFFFFFF);
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override public boolean isPauseScreen() { return false; }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
