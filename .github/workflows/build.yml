name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.SpiderModClient/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          # КОНФИГ
          cat << 'EOF' > src/client/java/com/example/client/SpiderConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class SpiderConfig {
              private static final File FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "spider-mod.json");
              public int mode = 0; // 0 = Vanilla, 1 = Grim, 2 = Polar, 3 = Elytra
              public boolean enabled = false;

              public static SpiderConfig INSTANCE = new SpiderConfig();

              public static void save() {
                  try (FileWriter w = new FileWriter(FILE)) { new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, w); } catch (Exception ignored) {}
              }
              public static void load() {
                  if (FILE.exists()) {
                      try (FileReader r = new FileReader(FILE)) {
                          SpiderConfig l = new Gson().fromJson(r, SpiderConfig.class);
                          if (l != null) INSTANCE = l;
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # ГЛАВНЫЙ КЛАСС
          cat << 'EOF' > src/client/java/com/example/client/SpiderModClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class SpiderModClient implements ClientModInitializer {
              private static boolean xKeyWasDown = false;
              private static boolean rCtrlWasDown = false;
              private static int tickTimer = 0;

              @Override
              public void onInitializeClient() {
                  SpiderConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();

                      // Right Ctrl - Меню
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof SpiderScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new SpiderScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // X - Вкл/Выкл
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown && client.screen == null) {
                          SpiderConfig.INSTANCE.enabled = !SpiderConfig.INSTANCE.enabled;
                          client.player.playSound(SpiderConfig.INSTANCE.enabled ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
                          SpiderConfig.save();
                      }
                      xKeyWasDown = xDown;

                      if (!SpiderConfig.INSTANCE.enabled || client.screen != null) return;

                      // Логика Спайдера
                      if (client.player.horizontalCollision && client.options.keyJump.isDown()) {
                          tickTimer++;
                          
                          switch (SpiderConfig.INSTANCE.mode) {
                              case 0: // Vanilla Spam (Bypass NCP)
                                  client.player.setDeltaMovement(0, 0.42, 0);
                                  client.player.connection.send(new ServerboundMovePlayerPacket.Pos(client.player.getX(), client.player.getY() + 0.42, client.player.getZ(), true, false));
                                  break;
                                  
                              case 1: // Grim Bypass (Fake Ground)
                                  // Отправляем фейковый прыжок с земли
                                  client.player.setDeltaMovement(0, 0.35, 0);
                                  client.player.connection.send(new ServerboundMovePlayerPacket.Pos(client.player.getX(), client.player.getY() + 0.35, client.player.getZ(), true, client.player.horizontalCollision));
                                  break;
                                  
                              case 2: // Polar Bypass (Micro-Jumps)
                                  if (tickTimer % 2 == 0) {
                                      client.player.setDeltaMovement(0, 0.28, 0);
                                      client.player.connection.send(new ServerboundMovePlayerPacket.Rot(client.player.getYRot(), client.player.getXRot(), true, false));
                                  }
                                  break;
                                  
                              case 3: // Elytra Spoof
                                  if (tickTimer % 10 == 0) {
                                      client.player.connection.send(new ServerboundPlayerCommandPacket(client.player, ServerboundPlayerCommandPacket.Action.START_FALL_FLYING));
                                  }
                                  client.player.setDeltaMovement(0, 0.3, 0);
                                  break;
                          }
                          client.player.fallDistance = 0;
                      } else {
                          tickTimer = 0;
                      }
                  });
              }
          }
          EOF

          # МЕНЮ
          cat << 'EOF' > src/client/java/com/example/client/SpiderScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class SpiderScreen extends Screen {
              public SpiderScreen() { super(Component.literal("Spider Bypasses")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  int x = this.width / 2 - 100;
                  int y = this.height / 2 - 40;
                  String[] names = {"Vanilla Spam", "Grim (Fake Ground)", "Polar (Micro-Jumps)", "Elytra Spoof"};

                  for (int i = 0; i < 4; i++) {
                      final int mode = i;
                      String btnText = (SpiderConfig.INSTANCE.mode == i ? "§a" : "§7") + names[i];
                      this.addRenderableWidget(Button.builder(Component.literal(btnText), b -> {
                          SpiderConfig.INSTANCE.mode = mode;
                          SpiderConfig.save();
                          this.init();
                      }).bounds(x, y + (i * 25), 200, 20).build());
                  }
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  context.drawCenteredString(this.font, "§l§bSpider Methods §7(X to toggle)", this.width / 2, this.height / 2 - 60, 0xFFFFFF);
                  context.drawCenteredString(this.font, "§7Status: " + (SpiderConfig.INSTANCE.enabled ? "§aENABLED" : "§cDISABLED"), this.width / 2, this.height / 2 - 45, 0xFFFFFF);
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override public boolean isPauseScreen() { return false; }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
