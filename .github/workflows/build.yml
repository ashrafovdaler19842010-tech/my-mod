name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: unzip -o mod.zip || true
      
      - name: Configure Project
        run: |
          sed -i 's/^fabric_loader_version=.*/fabric_loader_version=0.16.9/' gradle.properties
          sed -i 's/^minecraft_version=.*/minecraft_version=1.21.8/' gradle.properties

          rm -rf src

          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "triggerbot",
            "version": "1.0.0",
            "name": "Trigger Bot",
            "description": "Simple trigger bot for players only.",
            "authors": ["You"],
            "contact": {},
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.example.client.TriggerBotClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.8",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          mkdir -p src/client/java/com/example/client

          # --- ГЕНЕРАЦИЯ TriggerBotClient.java ---
          cat << 'EOF' > src/client/java/com/example/client/TriggerBotClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.player.Player;
          import org.lwjgl.glfw.GLFW;

          public class TriggerBotClient implements ClientModInitializer {
              // Настройки
              public static boolean enabled = false;
              public static boolean onlyCrits = true;
              public static int delayMs = 50; // Задержка между ударами в мс
              public static float range = 3.0f;

              private static boolean xKeyWasDown = false;
              private static boolean rCtrlWasDown = false;
              private static long lastAttackTime = 0;

              @Override
              public void onInitializeClient() {
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null || client.level == null) return;
                      long win = client.getWindow().getWindow();
                      long currentTime = System.currentTimeMillis();

                      // Открытие меню (Right Ctrl)
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof TriggerBotScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new TriggerBotScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // Включение/Выключение (X)
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown && client.screen == null) {
                          enabled = !enabled;
                          if (enabled) {
                              client.player.playSound(SoundEvents.EXPERIENCE_ORB_PICKUP, 1.0f, 1.0f);
                          } else {
                              client.player.playSound(SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
                          }
                      }
                      xKeyWasDown = xDown;

                      if (!enabled || client.gameMode == null) return;

                      // Получаем сущность, на которую смотрит игрок (как в Meteor)
                      Entity target = client.crosshairPickEntity;

                      if (target != null && target instanceof Player && target != client.player && target.isAlive()) {
                          // Проверка дистанции
                          if (client.player.distanceTo(target) > range) return;

                          // Проверка на крит (если включено)
                          if (onlyCrits) {
                              if (client.player.onGround() || client.player.fallDistance <= 0.0f) {
                                  return; // Не бьем, если не падаем
                              }
                          }

                          // Проверка кулдауна атаки
                          if (client.player.getAttackStrengthScale(0.5f) < 1.0f) return;

                          // Проверка задержки (в мс)
                          if (currentTime - lastAttackTime < delayMs) return;

                          // БЬЕМ!
                          client.gameMode.attack(client.player, target);
                          client.player.swing(InteractionHand.MAIN_HAND);
                          lastAttackTime = currentTime;
                      }
                  });
              }
          }
          EOF

          # --- ГЕНЕРАЦИЯ TriggerBotScreen.java ---
          cat << 'EOF' > src/client/java/com/example/client/TriggerBotScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class TriggerBotScreen extends Screen {
              public TriggerBotScreen() { super(Component.literal("Trigger Bot Settings")); }

              @Override
              protected void init() {
                  int x = width / 2 - 100;
                  int y = height / 2 - 60;

                  this.addRenderableWidget(Button.builder(Component.literal("Trigger Bot: " + (TriggerBotClient.enabled ? "§aON" : "§cOFF")), b -> {
                      TriggerBotClient.enabled = !TriggerBotClient.enabled;
                      b.setMessage(Component.literal("Trigger Bot: " + (TriggerBotClient.enabled ? "§aON" : "§cOFF")));
                  }).bounds(x, y, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("Only Crits: " + (TriggerBotClient.onlyCrits ? "§aON" : "§cOFF")), b -> {
                      TriggerBotClient.onlyCrits = !TriggerBotClient.onlyCrits;
                      b.setMessage(Component.literal("Only Crits: " + (TriggerBotClient.onlyCrits ? "§aON" : "§cOFF")));
                  }).bounds(x, y + 25, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("Delay: " + TriggerBotClient.delayMs + "ms"), b -> {
                      TriggerBotClient.delayMs += 10;
                      if (TriggerBotClient.delayMs > 200) TriggerBotClient.delayMs = 10;
                      b.setMessage(Component.literal("Delay: " + TriggerBotClient.delayMs + "ms"));
                  }).bounds(x, y + 50, 200, 20).build());
                  
                  this.addRenderableWidget(Button.builder(Component.literal("Range: " + TriggerBotClient.range), b -> {
                      TriggerBotClient.range += 0.5f;
                      if (TriggerBotClient.range > 6.0f) TriggerBotClient.range = 3.0f;
                      b.setMessage(Component.literal("Range: " + TriggerBotClient.range));
                  }).bounds(x, y + 75, 200, 20).build());
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  context.drawCenteredString(this.font, "§l§bTrigger Bot Menu", this.width / 2, this.height / 2 - 80, 0xFFFFFF);
                  super.render(context, mouseX, mouseY, delta);
              }
              
              @Override
              public boolean isPauseScreen() { return false; }
          }
          EOF

          if ! grep -q "duplicatesStrategy" build.gradle; then
            echo "" >> build.gradle
            echo "tasks.named('jar') {" >> build.gradle
            echo "    duplicatesStrategy = DuplicatesStrategy.EXCLUDE" >> build.gradle
            echo "}" >> build.gradle
            echo "tasks.named('sourcesJar') {" >> build.gradle
            echo "    duplicatesStrategy = DuplicatesStrategy.EXCLUDE" >> build.gradle
            echo "}" >> build.gradle
          fi

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - run: chmod +x gradlew && ./gradlew clean build
      
      - uses: actions/upload-artifact@v4
        with:
          name: custom-mod
          path: | 
            build/libs/*.jar
            !build/libs/*-sources.jar
