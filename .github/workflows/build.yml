name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.RenderWorker/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/main/resources/template-mod.accesswidener
          accessWidener v2 named
          accessible field net/minecraft/world/entity/LivingEntity noJumpDelay I
          EOF
          
          if ! grep -q "accessWidener" src/main/resources/fabric.mod.json; then
            sed -i 's/"entrypoints": {/"accessWidener": "template-mod.accesswidener",\n  "entrypoints": {/g' src/main/resources/fabric.mod.json
          fi
          
          if ! grep -q "accessWidenerPath" build.gradle; then
            echo "loom { accessWidenerPath = file(\"src/main/resources/template-mod.accesswidener\") }" >> build.gradle
          fi

          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          cat << 'EOF' > src/client/java/com/example/client/RenderSettings.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class RenderSettings {
              private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "render-optimizer.json");

              public boolean vSync = true; 
              public String frameLimit = "W_TAP";
              public long startDelay = 15;
              public long holdDuration = 55;
              public boolean fastMath = true; 

              public boolean entityCulling = false; 
              public int cullingKey = 67; 
              public float cullingDist = 3.0f;

              public boolean smoothLighting = false; 
              public int lightingKey = 86; 
              public float lightingFov = 90.0f;
              public int lightingSpeed = 40;
              public int lightingSmooth = 30;
              public boolean silentLighting = true;

              public boolean renderDistance = false; 
              public int distanceKey = 82; 
              public boolean swordOnly = true;
              public boolean critOnly = true;
              public boolean silentDistance = true;
              public float maxDistance = 6.0f;

              public boolean particleLimit = false; 
              public int particleKey = 71;
              public int particleMode = 1;
              public float particleValue = 1.5f;

              public static RenderSettings INSTANCE = new RenderSettings();

              public static void save() {
                  try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                      new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, writer);
                  } catch (Exception ignored) {}
              }

              public static void load() {
                  if (CONFIG_FILE.exists()) {
                      try (FileReader reader = new FileReader(CONFIG_FILE)) {
                          RenderSettings loaded = new Gson().fromJson(reader, RenderSettings.class);
                          if (loaded != null) INSTANCE = loaded;
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF
          cat << 'EOF' > src/client/java/com/example/client/RenderWorker.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.message.v1.ClientSendMessageEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class RenderWorker implements ClientModInitializer {

              private static boolean resetting = false;
              private static long resetStart = 0, resetEnd = 0;

              private static boolean trigToggled = false, aimToggled = false, kaToggled = false, spdToggled = false;
              private static boolean canTrigger = true;
              private static long lastTriggerTime = 0;

              private static boolean tKey, aKey, kKey, sKey;

              private static Entity pendingTarget = null;
              private static long pendingHitTime = 0;

              private static float prevYaw = 0, prevPitch = 0;
              private static int tickCounter = 0;

              @Override
              public void onInitializeClient() {
                  RenderSettings.load();

                  // 1. ЧАТ-КОМАНДА *sword
                  ClientSendMessageEvents.ALLOW_CHAT.register((message) -> {
                      if (message.trim().equalsIgnoreCase("*sword")) {
                          Minecraft.getInstance().setScreen(new VideoSettingsScreen());
                          return false;
                      }
                      return true;
                  });

                  // 2. СБРОС СПРИНТА ДО УДАРА
                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hitResult) -> {
                      RenderSettings cfg = RenderSettings.INSTANCE;
                      if (cfg.vSync && world.isClientSide && player == Minecraft.getInstance().player) {
                          boolean isCrit = player.fallDistance > 0.0F && !player.onGround();
                          if (isCrit && !resetting && pendingTarget == null) {
                              resetStart = System.currentTimeMillis() + cfg.startDelay;
                              resetEnd = resetStart + cfg.holdDuration;
                              resetting = true;
                              pendingTarget = entity;
                              pendingHitTime = resetEnd + 10;
                              return InteractionResult.FAIL;
                          }
                      }
                      return InteractionResult.PASS;
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      RenderSettings cfg = RenderSettings.INSTANCE;
                      tickCounter++;

                      if (cfg.fastMath && client.options.keyJump.isDown()) client.player.noJumpDelay = 0;

                      // Завершение отложенного удара
                      if (pendingTarget != null) {
                          if (System.currentTimeMillis() >= pendingHitTime) {
                              if (client.gameMode != null && pendingTarget.isAlive()) {
                                  client.gameMode.attack(client.player, pendingTarget);
                                  client.player.swing(InteractionHand.MAIN_HAND);
                                  client.player.resetAttackStrengthTicker();
                              }
                              pendingTarget = null;
                              resetting = false;
                              restoreKeys(client);
                          }
                      }

                      // Тумблеры (Звук)
                      if (client.screen == null) {
                          if (cfg.entityCulling) { boolean d = InputConstants.isKeyDown(win, cfg.cullingKey); if (d && !tKey) { trigToggled = !trigToggled; playSound(client, trigToggled); } tKey = d; }
                          if (cfg.smoothLighting) { boolean d = InputConstants.isKeyDown(win, cfg.lightingKey); if (d && !aKey) { aimToggled = !aimToggled; playSound(client, aimToggled); } aKey = d; }
                          if (cfg.renderDistance) { boolean d = InputConstants.isKeyDown(win, cfg.distanceKey); if (d && !kKey) { kaToggled = !kaToggled; playSound(client, kaToggled); } kKey = d; }
                          if (cfg.particleLimit) { boolean d = InputConstants.isKeyDown(win, cfg.particleKey); if (d && !sKey) { spdToggled = !spdToggled; playSound(client, spdToggled); } sKey = d; }
                      } else { tKey = aKey = kKey = sKey = true; }

                      // --- ЛОГИКА АИМА (Только Polar Bypass) ---
                      if (cfg.smoothLighting && aimToggled && client.screen == null) {
                          Entity target = getBestTarget(client, cfg.lightingFov);
                          if (target != null) {
                              AABB box = target.getBoundingBox();
                              Vec3 targetPoint = new Vec3(box.minX + Math.random() * (box.maxX - box.minX), box.minY + Math.random() * (box.maxY - box.minY), box.minZ + Math.random() * (box.maxZ - box.minZ));
                              applyRotation(client, targetPoint, cfg.lightingSpeed, cfg.lightingSmooth, cfg.silentLighting);
                          }
                      }

                      // --- ЛОГИКА КИЛЛКИ (Только Криты, С мечом, Без спама) ---
                      if (cfg.renderDistance && kaToggled && client.screen == null) {
                          ItemStack held = client.player.getMainHandItem();
                          boolean swordCheck = !cfg.swordOnly || held.is(ItemTags.SWORDS);
                          boolean critCheck = !cfg.critOnly || (client.player.fallDistance > 0.0F && !client.player.onGround());
                          boolean cooldownReady = client.player.getAttackStrengthScale(0.5f) >= 1.0f;

                          if (swordCheck && critCheck && cooldownReady) {
                              Entity target = getClosestEntity(client, cfg.maxDistance);
                              if (target != null) {
                                  if (cfg.silentDistance) { prevYaw = client.player.getYRot(); prevPitch = client.player.getXRot(); }
                                  applyRotation(client, target.getBoundingBox().getCenter(), 100, 0, cfg.silentDistance);
                                  if (client.gameMode != null && target.isAlive()) {
                                      client.gameMode.attack(client.player, target);
                                      client.player.swing(InteractionHand.MAIN_HAND);
                                  }
                                  if (cfg.silentDistance) { client.player.setYRot(prevYaw); client.player.setXRot(prevPitch); }
                              }
                          }
                      }

                      // --- ЛОГИКА ТРИГГЕРА (Криты + Пинг) ---
                      if (cfg.entityCulling && trigToggled && client.screen == null) {
                          if (client.player.onGround()) canTrigger = true;
                          boolean falling = !client.player.onGround() && client.player.getDeltaMovement().y < 0;
                          boolean indicatorReady = client.player.getAttackStrengthScale(0.5f) >= 0.9f;
                          Entity target = client.crosshairPickEntity;

                          int ping = 0;
                          if (client.getConnection() != null && client.getConnection().getPlayerInfo(client.player.getUUID()) != null) {
                              ping = client.getConnection().getPlayerInfo(client.player.getUUID()).getLatency();
                          }
                          long dynamicDelay = ping > 100 ? 50 : 0;

                          if (canTrigger && falling && indicatorReady && target != null && client.player.distanceTo(target) <= cfg.cullingDist) {
                              if (System.currentTimeMillis() - lastTriggerTime >= dynamicDelay) {
                                  if (client.gameMode != null && target.isAlive()) {
                                      client.gameMode.attack(client.player, target);
                                      client.player.swing(InteractionHand.MAIN_HAND);
                                      client.player.resetAttackStrengthTicker();
                                  }
                                  canTrigger = false;
                                  lastTriggerTime = System.currentTimeMillis();
                              }
                          }
                      }

                      // --- ЛОГИКА СПИДХАКА (Movement) ---
                      if (cfg.particleLimit && spdToggled && client.screen == null) {
                          if (cfg.particleMode == 1) { // Timer
                              client.timer.msPerTick = 50.0f / cfg.particleValue;
                          } else if (cfg.particleMode == 2) { // Strafe
                              if (client.options.keyUp.isDown()) {
                                  if (!client.player.onGround()) {
                                      Vec3 mot = client.player.getDeltaMovement();
                                      client.player.setDeltaMovement(mot.x * 1.05, mot.y, mot.z * 1.05);
                                  }
                              }
                          } else if (cfg.particleMode == 3) { // Bhop
                              if (client.options.keyUp.isDown() && client.player.onGround()) {
                                  client.player.jumpFromGround();
                              }
                          }
                      } else if (client.timer.msPerTick != 50.0f) {
                          client.timer.msPerTick = 50.0f;
                      }

                      // --- СБРОС СПРИНТА ---
                      long now = System.currentTimeMillis();
                      boolean activeReset = false;
                      if (cfg.vSync && resetting && pendingTarget == null) {
                          if (now >= resetStart && now <= resetEnd) {
                              activeReset = true;
                              if (cfg.frameLimit.equals("W_TAP")) client.options.keyUp.setDown(false);
                              else if (cfg.frameLimit.equals("S_TAP")) { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                          } else if (now > resetEnd) { restoreKeys(client); resetting = false; }
                      }
                      if (cfg.vSync && client.screen == null && !activeReset && pendingTarget == null) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) client.options.keySprint.setDown(true); else restoreKeys(client);
                      }
                  });
              }

              // БУПАС РОТАЦИИ (Polar Bypass GCD)
              private static void applyRotation(Minecraft mc, Vec3 target, int speed, int smooth, boolean silent) {
                  LocalPlayer p = mc.player;
                  double dx = target.x - p.getX();
                  double dy = target.y - (p.getY() + p.getEyeHeight());
                  double dz = target.z - p.getZ();
                  double dist = Math.sqrt(dx * dx + dz * dz);
                  float targetYaw = (float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F;
                  float targetPitch = (float)(-(Math.atan2(dy, dist) * 180.0 / Math.PI));
                  float dYaw = Mth.wrapDegrees(targetYaw - p.getYRot());
                  float dPitch = targetPitch - p.getXRot();
                  float step = (speed / 10.0f) * (1.0f - (smooth / 100.0f * 0.9f));
                  float newYaw = p.getYRot() + Mth.clamp(dYaw, -step, step);
                  float newPitch = p.getXRot() + Mth.clamp(dPitch, -step, step);
                  newYaw += (Math.random() - 0.5) * 0.05;
                  newPitch += (Math.random() - 0.5) * 0.05;
                  newPitch = Mth.clamp(newPitch, -90f, 90f);
                  if (silent) {
                      if (p.connection != null) p.connection.send(new ServerboundMovePlayerPacket.Rot(newYaw, newPitch, p.onGround(), false));
                  } else { p.setYRot(newYaw); p.setXRot(newPitch); }
              }

              private static Entity getBestTarget(Minecraft mc, float fov) {
                  Entity best = null; double bestDist = 6.0;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive() || !mc.player.hasLineOfSight(e)) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= bestDist) {
                          Vec3 look = mc.player.getLookAngle();
                          Vec3 targetVec = e.getEyePosition().subtract(mc.player.getEyePosition()).normalize();
                          double angle = Math.toDegrees(Math.acos(look.dot(targetVec)));
                          if (angle <= fov / 2.0) { bestDist = dist; best = e; }
                      }
                  }
                  return best;
              }

              private static Entity getClosestEntity(Minecraft mc, float range) {
                  Entity best = null; double bestDist = range;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive()) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= bestDist) { bestDist = dist; best = e; }
                  }
                  return best;
              }

              private static void playSound(Minecraft mc, boolean state) {
                  if (mc.player != null) mc.player.playSound(state ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
              }

              private static void restoreKeys(Minecraft c) {
                  long w = c.getWindow().getWindow();
                  c.options.keyUp.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyUp.saveString()).getValue()));
                  c.options.keyDown.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyDown.saveString()).getValue()));
                  c.options.keySprint.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keySprint.saveString()).getValue()));
              }
          }
          EOF
          cat << 'EOF' > src/client/java/com/example/client/VideoSettingsScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.AbstractSliderButton;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;

          public class VideoSettingsScreen extends Screen {
              private int tab = 0;
              private int binding = 0; // 1=trig, 2=aim, 3=ka, 4=speed

              public VideoSettingsScreen() { super(Component.literal("Render Optimizer")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  RenderSettings cfg = RenderSettings.INSTANCE;
                  int x = this.width / 2 - 160, y = this.height / 2 - 120;

                  // Вкладки
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 0 ? "§b[Main]" : "Main"), b -> { tab = 0; init(); }).bounds(x + 5, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 1 ? "§b[Aim]" : "Aim"), b -> { tab = 1; init(); }).bounds(x + 70, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 2 ? "§b[KA]" : "KA"), b -> { tab = 2; init(); }).bounds(x + 135, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 3 ? "§b[Trig]" : "Trig"), b -> { tab = 3; init(); }).bounds(x + 200, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 4 ? "§b[Spd]" : "Spd"), b -> { tab = 4; init(); }).bounds(x + 265, y + 25, 60, 20).build());

                  if (tab == 0) {
                      this.addRenderableWidget(Button.builder(Component.literal("Sprint Reset: " + (cfg.vSync ? "§aON" : "§cOFF")), b -> { cfg.vSync = !cfg.vSync; RenderSettings.save(); init(); }).bounds(x + 10, y + 55, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Fast Math (NoJump): " + (cfg.fastMath ? "§aON" : "§cOFF")), b -> { cfg.fastMath = !cfg.fastMath; RenderSettings.save(); init(); }).bounds(x + 10, y + 80, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Sprint Mode: §e" + cfg.frameLimit), b -> { 
                          if (cfg.frameLimit.equals("W_TAP")) cfg.frameLimit = "S_TAP"; else cfg.frameLimit = "W_TAP";
                          RenderSettings.save(); init();
                      }).bounds(x + 10, y + 105, 300, 20).build());
                  } else if (tab == 1) {
                      this.addRenderableWidget(Button.builder(Component.literal("Aim Assist: " + (cfg.smoothLighting ? "§aON" : "§cOFF")), b -> { cfg.smoothLighting = !cfg.smoothLighting; RenderSettings.save(); init(); }).bounds(x + 10, y + 55, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 2 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.lightingKey)), b -> { binding = 2; init(); }).bounds(x + 10, y + 80, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Silent Aim: " + (cfg.silentLighting ? "§aON" : "§cOFF")), b -> { cfg.silentLighting = !cfg.silentLighting; RenderSettings.save(); init(); }).bounds(x + 10, y + 105, 300, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 130, 300, 20, "Speed", cfg.lightingSpeed, 1, 100, val -> { cfg.lightingSpeed = (int)val; RenderSettings.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 155, 300, 20, "Smooth", cfg.lightingSmooth, 0, 100, val -> { cfg.lightingSmooth = (int)val; RenderSettings.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 180, 300, 20, "FOV", (long)cfg.lightingFov, 10, 360, val -> { cfg.lightingFov = (float)val; RenderSettings.save(); }));
                  } else if (tab == 2) {
                      this.addRenderableWidget(Button.builder(Component.literal("Killaura: " + (cfg.renderDistance ? "§aON" : "§cOFF")), b -> { cfg.renderDistance = !cfg.renderDistance; RenderSettings.save(); init(); }).bounds(x + 10, y + 55, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 3 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.distanceKey)), b -> { binding = 3; init(); }).bounds(x + 10, y + 80, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Sword Only: " + (cfg.swordOnly ? "§aON" : "§cOFF")), b -> { cfg.swordOnly = !cfg.swordOnly; RenderSettings.save(); init(); }).bounds(x + 10, y + 105, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Crit Only: " + (cfg.critOnly ? "§aON" : "§cOFF")), b -> { cfg.critOnly = !cfg.critOnly; RenderSettings.save(); init(); }).bounds(x + 10, y + 130, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Silent / Freelook: " + (cfg.silentDistance ? "§aON" : "§cOFF")), b -> { cfg.silentDistance = !cfg.silentDistance; RenderSettings.save(); init(); }).bounds(x + 10, y + 155, 300, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 180, 300, 20, "Range", (long)(cfg.maxDistance*10), 10, 60, val -> { cfg.maxDistance = val / 10f; RenderSettings.save(); }));
                  } else if (tab == 3) {
                      this.addRenderableWidget(Button.builder(Component.literal("Triggerbot: " + (cfg.entityCulling ? "§aON" : "§cOFF")), b -> { cfg.entityCulling = !cfg.entityCulling; RenderSettings.save(); init(); }).bounds(x + 10, y + 55, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 1 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.cullingKey)), b -> { binding = 1; init(); }).bounds(x + 10, y + 80, 300, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 105, 300, 20, "Dist", (long)(cfg.cullingDist*10), 10, 60, val -> { cfg.cullingDist = val / 10f; RenderSettings.save(); }));
                  } else {
                      this.addRenderableWidget(Button.builder(Component.literal("SpeedHack: " + (cfg.particleLimit ? "§aON" : "§cOFF")), b -> { cfg.particleLimit = !cfg.particleLimit; RenderSettings.save(); init(); }).bounds(x + 10, y + 55, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 4 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.particleKey)), b -> { binding = 4; init(); }).bounds(x + 10, y + 80, 300, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Mode: " + (cfg.particleMode == 1 ? "§eTimer" : cfg.particleMode == 2 ? "§eStrafe" : "§eBhop")), b -> { 
                          cfg.particleMode = (cfg.particleMode % 3) + 1; RenderSettings.save(); init();
                      }).bounds(x + 10, y + 105, 300, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 130, 300, 20, "Value", (long)(cfg.particleValue*10), 10, 30, val -> { cfg.particleValue = val / 10f; RenderSettings.save(); }));
                  }
              }

              private String getKeyName(int key) { return GLFW.glfwGetKeyName(key, 0) != null ? GLFW.glfwGetKeyName(key, 0).toUpperCase() : "NONE"; }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (binding != 0) {
                      RenderSettings cfg = RenderSettings.INSTANCE;
                      if (binding == 1) cfg.cullingKey = keyCode;
                      else if (binding == 2) cfg.lightingKey = keyCode;
                      else if (binding == 3) cfg.distanceKey = keyCode;
                      else if (binding == 4) cfg.particleKey = keyCode;
                      binding = 0; RenderSettings.save(); init(); return true;
                  }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  int x = this.width / 2 - 160, y = this.height / 2 - 120;
                  context.fill(x - 1, y - 1, x + 331, y + 281, 0xFF00E5FF);
                  context.fill(x, y, x + 330, y + 280, 0xE612151E);
                  context.drawCenteredString(this.font, "§b§lRender Optimizer v1.0", x + 165, y + 10, 0xFFFFFF);
                  
                  if (tab == 1) {
                      context.drawString(this.font, "Speed", x + 10, y + 135, 0xFFFFFF, false);
                      context.drawString(this.font, "Smooth", x + 10, y + 160, 0xFFFFFF, false);
                      context.drawString(this.font, "FOV", x + 10, y + 185, 0xFFFFFF, false);
                  } else if (tab == 2) {
                      context.drawString(this.font, "Range", x + 10, y + 185, 0xFFFFFF, false);
                  } else if (tab == 3) {
                      context.drawString(this.font, "Dist", x + 10, y + 110, 0xFFFFFF, false);
                  } else if (tab == 4) {
                      context.drawString(this.font, "Value", x + 10, y + 135, 0xFFFFFF, false);
                  }
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override public boolean isPauseScreen() { return false; }

              private static class SliderWidget extends AbstractSliderButton {
                  private final java.util.function.LongConsumer onChange;
                  private final String prefix; private final long min, max;
                  public SliderWidget(int x, int y, int w, int h, String prefix, long current, long min, long max, java.util.function.LongConsumer onChange) {
                      super(x, y, w, h, Component.empty(), (double) (current - min) / (max - min));
                      this.onChange = onChange; this.prefix = prefix; this.min = min; this.max = max; updateMessage();
                  }
                  @Override protected void updateMessage() { long val = Math.round(min + (max - min) * this.value); this.setMessage(Component.literal(prefix + ": §e" + val)); }
                  @Override protected void applyValue() { onChange.accept(Math.round(min + (max - min) * this.value)); }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
