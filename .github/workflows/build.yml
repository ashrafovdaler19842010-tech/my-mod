name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.CombatUtilsClient/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          cat << 'EOF' > src/client/java/com/example/client/ModConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class ModConfig {
              private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "combat-utils.json");

              public boolean sprintEnabled = true;
              public boolean autoSprint = true;
              public String sprintMode = "W_TAP";
              public long startDelayMs = 15;
              public long holdDurationMs = 55;

              public boolean showHud = true;
              public int critX = 10, critY = 10, critSize = 15;
              public String pinkColor = "#FF69B4", whiteColor = "#FFFFFF", redColor = "#FF0000";

              // Triggerbot
              public boolean triggerbotEnabled = false;
              public int triggerbotKey = 67; // C
              public float triggerMaxDist = 3.0f;
              public int triggerDelay = 0;

              // Aim Assist
              public boolean aimAssistEnabled = false;
              public int aimKey = 86; // V
              public float aimFov = 90.0f;
              public int aimMode = 1; // 0=Snap, 1=Smooth, 2=Polar, 3=EaseOut, 4=Sine
              public int aimSpeed = 30;
              public int aimSmoothness = 50;
              public boolean aimWallCheck = true;
              public boolean aimSilent = true;
              public boolean hitboxAim = true;

              // Killaura
              public boolean killauraEnabled = false;
              public int killauraKey = 82; // R
              public boolean swordOnly = true;
              public boolean killauraWallCheck = true;
              public boolean killauraSilent = true;
              public float killauraRange = 3.5f;
              public int killauraDelay = 50;
              public int killauraRotationMode = 0; // 0=Snap, 1=Smooth, etc.

              public static ModConfig INSTANCE = new ModConfig();

              public static void save() {
                  try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                      new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, writer);
                  } catch (Exception ignored) {}
              }

              public static void load() {
                  if (CONFIG_FILE.exists()) {
                      try (FileReader reader = new FileReader(CONFIG_FILE)) {
                          ModConfig loaded = new Gson().fromJson(reader, ModConfig.class);
                          if (loaded != null) INSTANCE = loaded;
                      } catch (Exception ignored) {}
                  }
              }

              public static int parseHexColor(String hex) {
                  try {
                      String clean = hex.replace("#", "").trim();
                      if (clean.length() == 6) return 0xFF000000 | Integer.parseInt(clean, 16);
                  } catch (Exception ignored) {}
                  return 0xFFFFFFFF;
              }
          }
          EOF

          cat << 'EOF' > src/client/java/com/example/client/CombatUtilsClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.network.chat.Component;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class CombatUtilsClient implements ClientModInitializer {

              private static boolean rCtrlWasDown = false;
              private static boolean resetting = false;
              private static long resetStart = 0, resetEnd = 0;

              private static boolean triggerToggled = false;
              private static boolean canTrigger = true;
              private static long lastTriggerTime = 0;

              private static boolean aimToggled = false;
              private static boolean killauraToggled = false;

              private static boolean trigKeyWasDown = false;
              private static boolean aimKeyWasDown = false;
              private static boolean kaKeyWasDown = false;

              private static float lastYaw = 0, lastPitch = 0;
              private static long lastUpdate = 0;

              @Override
              public void onInitializeClient() {
                  ModConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      ModConfig cfg = ModConfig.INSTANCE;

                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof ModConfigScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new ModConfigScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      if (client.screen == null) {
                          if (cfg.triggerbotEnabled) {
                              boolean tDown = InputConstants.isKeyDown(win, cfg.triggerbotKey);
                              if (tDown && !trigKeyWasDown) {
                                  triggerToggled = !triggerToggled;
                                  client.player.displayClientMessage(Component.literal("Triggerbot: " + (triggerToggled ? "§aON" : "§cOFF")), true);
                              }
                              trigKeyWasDown = tDown;
                          }
                          if (cfg.aimAssistEnabled) {
                              boolean aDown = InputConstants.isKeyDown(win, cfg.aimKey);
                              if (aDown && !aimKeyWasDown) {
                                  aimToggled = !aimToggled;
                                  client.player.displayClientMessage(Component.literal("AimAssist: " + (aimToggled ? "§aON" : "§cOFF")), true);
                              }
                              aimKeyWasDown = aDown;
                          }
                          if (cfg.killauraEnabled) {
                              boolean kDown = InputConstants.isKeyDown(win, cfg.killauraKey);
                              if (kDown && !kaKeyWasDown) {
                                  killauraToggled = !killauraToggled;
                                  client.player.displayClientMessage(Component.literal("Killaura: " + (killauraToggled ? "§aON" : "§cOFF")), true);
                              }
                              kaKeyWasDown = kDown;
                          }
                      } else {
                          trigKeyWasDown = true; aimKeyWasDown = true; kaKeyWasDown = true;
                      }

                      // --- AIM ASSIST ---
                      if (cfg.aimAssistEnabled && aimToggled && client.screen == null) {
                          Entity target = getBestTarget(client, cfg.aimFov, cfg.aimWallCheck);
                          if (target instanceof LivingEntity living) {
                              Vec3 targetPos = getTargetPoint(living, cfg.hitboxAim);
                              applyRotation(client, targetPos, cfg, cfg.aimMode, cfg.aimSpeed, cfg.aimSilent, cfg.aimSmoothness);
                          }
                      }

                      // --- KILLAURA ---
                      if (cfg.killauraEnabled && killauraToggled && client.screen == null) {
                          if (System.currentTimeMillis() - lastTriggerTime >= cfg.killauraDelay) {
                              ItemStack held = client.player.getMainHandItem();
                              if (!cfg.swordOnly || held.is(ItemTags.SWORDS)) {
                                  Entity target = getClosestEntity(client, cfg.killauraRange, cfg.killauraWallCheck);
                                  if (target != null) {
                                      applyRotation(client, target.getBoundingBox().getCenter(), cfg, cfg.killauraRotationMode, 100, cfg.killauraSilent, 0);
                                      
                                      if (client.gameMode != null && target.isAlive()) {
                                          client.gameMode.attack(client.player, target);
                                          client.player.swing(InteractionHand.MAIN_HAND);
                                      }
                                      lastTriggerTime = System.currentTimeMillis();
                                  }
                              }
                          }
                      }

                      // --- TRIGGERBOT ---
                      if (cfg.triggerbotEnabled && triggerToggled && client.screen == null) {
                          if (client.player.onGround()) canTrigger = true;

                          boolean falling = !client.player.onGround() && client.player.getDeltaMovement().y < 0 && client.player.fallDistance > 0;
                          Entity target = client.crosshairPickEntity;

                          if (canTrigger && falling && target != null && client.player.distanceTo(target) <= cfg.triggerMaxDist) {
                              if (System.currentTimeMillis() - lastTriggerTime >= cfg.triggerDelay) {
                                  if (client.gameMode != null && target.isAlive()) {
                                      client.gameMode.attack(client.player, target);
                                      client.player.swing(InteractionHand.MAIN_HAND);
                                      client.player.resetAttackStrengthTicker();
                                  }
                                  canTrigger = false;
                                  lastTriggerTime = System.currentTimeMillis();
                              }
                          }
                      }

                      // --- AUTO SPRINT ---
                      long now = System.currentTimeMillis();
                      boolean activeReset = false;
                      if (cfg.sprintEnabled && resetting) {
                          if (now >= resetStart && now <= resetEnd) {
                              activeReset = true;
                              if (cfg.sprintMode.equals("W_TAP")) client.options.keyUp.setDown(false);
                              else if (cfg.sprintMode.equals("S_TAP")) { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                              else if (cfg.sprintMode.equals("SPRINT")) client.options.keySprint.setDown(false);
                          } else if (now > resetEnd) {
                              restoreKeys(client);
                              resetting = false;
                          }
                      }

                      if (cfg.autoSprint && client.screen == null && !activeReset) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) {
                              client.options.keySprint.setDown(true);
                          } else {
                              restoreKeys(client);
                          }
                      }
                  });

                  HudRenderCallback.EVENT.register((context, tickCounter) -> renderHud(context));
              }

              // --- ROTATIONS (Grim / Matrix / Polar Bypass) ---
              private static void applyRotation(Minecraft mc, Vec3 target, ModConfig cfg, int mode, int speed, boolean silent, int smoothness) {
                  LocalPlayer player = mc.player;
                  float[] rots = getRotations(player.getEyePosition(), target);
                  float targetYaw = rots[0];
                  float targetPitch = rots[1];

                  float deltaYaw = Mth.wrapDegrees(targetYaw - player.getYRot());
                  float deltaPitch = targetPitch - player.getXRot();

                  float newYaw = player.getYRot();
                  float newPitch = player.getXRot();

                  // Плавность влияет на скорость (100 smooth = медленно)
                  float speedMult = 1.0f - (smoothness / 100f * 0.8f);
                  float step = speed * 0.1f * speedMult;

                  switch (mode) {
                      case 0: // Snap
                          newYaw = targetYaw;
                          newPitch = targetPitch;
                          break;
                      case 1: // Smooth
                          newYaw += Mth.clamp(deltaYaw, -step, step);
                          newPitch += Mth.clamp(deltaPitch, -step, step);
                          break;
                      case 2: // Polar (сначала Yaw, потом Pitch)
                          if (Math.abs(deltaYaw) > 0.5f) {
                              newYaw += Mth.clamp(deltaYaw, -step, step);
                          } else {
                              newPitch += Mth.clamp(deltaPitch, -step, step);
                          }
                          break;
                      case 3: // EaseOut (замедление у цели)
                          float easeFactor = Math.min(1.0f, Math.abs(deltaYaw) / 15.0f + 0.1f);
                          newYaw += Mth.clamp(deltaYaw, -step * easeFactor, step * easeFactor);
                          newPitch += Mth.clamp(deltaPitch, -step * easeFactor, step * easeFactor);
                          break;
                      case 4: // Sine (синусоида - обход матрикса)
                          // Добавляем синусоидальное дрожание при повороте
                          float sineWave = (float) Math.sin(System.currentTimeMillis() % 1000 / 1000.0 * Math.PI * 2) * 0.5f;
                          newYaw += Mth.clamp(deltaYaw, -step, step) + sineWave;
                          newPitch += Mth.clamp(deltaPitch, -step, step) + sineWave;
                          break;
                  }

                  newPitch = Mth.clamp(newPitch, -90.0f, 90.0f);

                  if (silent) {
                      // Отправляем пакет серверу с новым поворотом, но камеру не двигаем
                      if (player.connection != null) {
                          player.connection.send(new ServerboundMovePlayerPacket.Rot(newYaw, newPitch, player.onGround(), false));
                      }
                  } else {
                      player.setYRot(newYaw);
                      player.setXRot(newPitch);
                  }
              }

              private static Entity getBestTarget(Minecraft mc, float fov, boolean wallCheck) {
                  Entity best = null;
                  double bestDist = Double.MAX_VALUE;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive()) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= 6.0) { 
                          if (wallCheck && !mc.player.hasLineOfSight(e)) continue;
                          Vec3 targetVec = e.getEyePosition().subtract(mc.player.getEyePosition()).normalize();
                          double angle = Math.toDegrees(Math.acos(mc.player.getLookAngle().dot(targetVec)));
                          if (angle <= fov / 2.0) {
                              if (dist < bestDist) { bestDist = dist; best = e; }
                          }
                      }
                  }
                  return best;
              }

              private static Entity getClosestEntity(Minecraft mc, float range, boolean wallCheck) {
                  Entity best = null;
                  double bestDist = range;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive()) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= bestDist) {
                          if (wallCheck && !mc.player.hasLineOfSight(e)) continue;
                          bestDist = dist;
                          best = e;
                      }
                  }
                  return best;
              }

              private static Vec3 getTargetPoint(LivingEntity target, boolean hitbox) {
                  if (hitbox) {
                      AABB box = target.getBoundingBox();
                      double randX = box.minX + Math.random() * (box.maxX - box.minX);
                      double randY = box.minY + Math.random() * (box.maxY - box.minY);
                      double randZ = box.minZ + Math.random() * (box.maxZ - box.minZ);
                      return new Vec3(randX, randY, randZ);
                  }
                  return target.getEyePosition();
              }

              private static float[] getRotations(Vec3 from, Vec3 to) {
                  double dx = to.x - from.x;
                  double dy = to.y - from.y;
                  double dz = to.z - from.z;
                  double distXZ = Math.sqrt(dx * dx + dz * dz);
                  float yaw = (float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F;
                  float pitch = (float)(-(Math.atan2(dy, distXZ) * 180.0 / Math.PI));
                  return new float[]{yaw, pitch};
              }

              private static void restoreKeys(Minecraft client) {
                  long win = client.getWindow().getWindow();
                  InputConstants.Key upKey = InputConstants.getKey(client.options.keyUp.saveString());
                  client.options.keyUp.setDown(InputConstants.isKeyDown(win, upKey.getValue()));
                  InputConstants.Key downKey = InputConstants.getKey(client.options.keyDown.saveString());
                  client.options.keyDown.setDown(InputConstants.isKeyDown(win, downKey.getValue()));
                  InputConstants.Key sprintKey = InputConstants.getKey(client.options.keySprint.saveString());
                  client.options.keySprint.setDown(InputConstants.isKeyDown(win, sprintKey.getValue()));
              }

              private static void renderHud(GuiGraphics context) {
                  Minecraft mc = Minecraft.getInstance();
                  LocalPlayer player = mc.player;
                  if (player == null || mc.options.hideGui) return;
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (!cfg.showHud) return;

                  boolean falling = player.fallDistance > 0.0F && !player.onGround() && !player.onClimbable() && !player.isInWater();
                  boolean inWater = player.isInWater();
                  double dist = 100.0;

                  Entity target = mc.crosshairPickEntity;
                  if (target != null) dist = player.distanceTo(target);

                  int color = ModConfig.parseHexColor(cfg.whiteColor);
                  if (dist <= 3.0) {
                      if (inWater) color = ModConfig.parseHexColor(cfg.redColor);
                      else if (falling) color = ModConfig.parseHexColor(cfg.pinkColor);
                  }

                  context.fill(cfg.critX, cfg.critY, cfg.critX + cfg.critSize, cfg.critY + cfg.critSize, color);
                  context.renderOutline(cfg.critX - 1, cfg.critY - 1, cfg.critSize + 2, cfg.critSize + 2, 0xFF000000);
              }
          }
          EOF

          cat << 'EOF' > src/client/java/com/example/client/ModConfigScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.AbstractSliderButton;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;

          public class ModConfigScreen extends Screen {
              private int tab = 0;
              private boolean dragging = false;
              private int dragX, dragY;
              private int binding = 0;

              public ModConfigScreen() { super(Component.literal("Combat Utils")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  ModConfig cfg = ModConfig.INSTANCE;
                  int x = this.width / 2 - 140, y = this.height / 2 - 130;

                  this.addRenderableWidget(Button.builder(Component.literal(tab == 0 ? "§b[Spr]" : "Spr"), b -> { tab = 0; init(); }).bounds(x + 5, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 1 ? "§b[Trig]" : "Trig"), b -> { tab = 1; init(); }).bounds(x + 70, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 2 ? "§b[Aim]" : "Aim"), b -> { tab = 2; init(); }).bounds(x + 135, y + 25, 60, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 3 ? "§b[KA]" : "KA"), b -> { tab = 3; init(); }).bounds(x + 200, y + 25, 60, 20).build());

                  if (tab == 0) {
                      this.addRenderableWidget(Button.builder(Component.literal("Sprint: " + (cfg.sprintEnabled ? "§aON" : "§cOFF")), b -> { cfg.sprintEnabled = !cfg.sprintEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("AutoSprint: " + (cfg.autoSprint ? "§aON" : "§cOFF")), b -> { cfg.autoSprint = !cfg.autoSprint; ModConfig.save(); init(); }).bounds(x + 10, y + 80, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Show HUD: " + (cfg.showHud ? "§aON" : "§cOFF")), b -> { cfg.showHud = !cfg.showHud; ModConfig.save(); init(); }).bounds(x + 10, y + 105, 260, 20).build());
                  } else if (tab == 1) {
                      this.addRenderableWidget(Button.builder(Component.literal("Triggerbot: " + (cfg.triggerbotEnabled ? "§aON" : "§cOFF")), b -> { cfg.triggerbotEnabled = !cfg.triggerbotEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 1 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.triggerbotKey)), b -> { binding = 1; init(); }).bounds(x + 10, y + 80, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 105, 260, 20, "Max Dist", (long)(cfg.triggerMaxDist*10), 10, 60, val -> { cfg.triggerMaxDist = val / 10f; ModConfig.save(); }));
                  } else if (tab == 2) {
                      this.addRenderableWidget(Button.builder(Component.literal("Aim Assist: " + (cfg.aimAssistEnabled ? "§aON" : "§cOFF")), b -> { cfg.aimAssistEnabled = !cfg.aimAssistEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 50, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 2 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.aimKey)), b -> { binding = 2; init(); }).bounds(x + 10, y + 75, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Mode: " + getRotModeName(cfg.aimMode)), b -> { cfg.aimMode = (cfg.aimMode + 1) % 5; ModConfig.save(); init(); }).bounds(x + 10, y + 100, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Silent: " + (cfg.aimSilent ? "§aON" : "§cOFF")), b -> { cfg.aimSilent = !cfg.aimSilent; ModConfig.save(); init(); }).bounds(x + 10, y + 125, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Wall Check: " + (cfg.aimWallCheck ? "§aON" : "§cOFF")), b -> { cfg.aimWallCheck = !cfg.aimWallCheck; ModConfig.save(); init(); }).bounds(x + 10, y + 150, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 175, 260, 20, "FOV", (long)cfg.aimFov, 10, 360, val -> { cfg.aimFov = (float)val; ModConfig.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 200, 260, 20, "Smoothness", cfg.aimSmoothness, 0, 100, val -> { cfg.aimSmoothness = (int)val; ModConfig.save(); }));
                  } else {
                      this.addRenderableWidget(Button.builder(Component.literal("Killaura: " + (cfg.killauraEnabled ? "§aON" : "§cOFF")), b -> { cfg.killauraEnabled = !cfg.killauraEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 50, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal(binding == 3 ? "§ePress Key..." : "Bind: " + getKeyName(cfg.killauraKey)), b -> { binding = 3; init(); }).bounds(x + 10, y + 75, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Mode: " + getRotModeName(cfg.killauraRotationMode)), b -> { cfg.killauraRotationMode = (cfg.killauraRotationMode + 1) % 5; ModConfig.save(); init(); }).bounds(x + 10, y + 100, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Sword Only: " + (cfg.swordOnly ? "§aON" : "§cOFF")), b -> { cfg.swordOnly = !cfg.swordOnly; ModConfig.save(); init(); }).bounds(x + 10, y + 125, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Silent: " + (cfg.killauraSilent ? "§aON" : "§cOFF")), b -> { cfg.killauraSilent = !cfg.killauraSilent; ModConfig.save(); init(); }).bounds(x + 10, y + 150, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Wall Check: " + (cfg.killauraWallCheck ? "§aON" : "§cOFF")), b -> { cfg.killauraWallCheck = !cfg.killauraWallCheck; ModConfig.save(); init(); }).bounds(x + 10, y + 175, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 200, 260, 20, "Range", (long)(cfg.killauraRange*10), 10, 60, val -> { cfg.killauraRange = val / 10f; ModConfig.save(); }));
                  }
              }

              private String getRotModeName(int mode) {
                  return switch (mode) {
                      case 0 -> "§cSnap";
                      case 1 -> "§aSmooth";
                      case 2 -> "§ePolar";
                      case 3 -> "§bEaseOut";
                      default -> "§dSine";
                  };
              }

              private String getKeyName(int key) { return GLFW.glfwGetKeyName(key, 0) != null ? GLFW.glfwGetKeyName(key, 0).toUpperCase() : "NONE"; }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (binding != 0) {
                      ModConfig cfg = ModConfig.INSTANCE;
                      if (binding == 1) cfg.triggerbotKey = keyCode;
                      else if (binding == 2) cfg.aimKey = keyCode;
                      else if (binding == 3) cfg.killauraKey = keyCode;
                      binding = 0; ModConfig.save(); init(); return true;
                  }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  int x = this.width / 2 - 140, y = this.height / 2 - 130;
                  context.fill(x - 1, y - 1, x + 271, y + 241, 0xFF00E5FF);
                  context.fill(x, y, x + 270, y + 240, 0xE612151E);
                  context.drawCenteredString(this.font, "§b§lCombat Utils", x + 135, y + 10, 0xFFFFFF);
                  if (tab == 2) {
                      context.drawString(this.font, "FOV", x + 10, y + 180, 0xFFFFFF, false);
                      context.drawString(this.font, "Smoothness", x + 10, y + 205, 0xFFFFFF, false);
                  } else if (tab == 3) {
                      context.drawString(this.font, "Range", x + 10, y + 205, 0xFFFFFF, false);
                  }
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (tab == 0 && button == 0 && mouseX >= cfg.critX && mouseX <= cfg.critX + cfg.critSize && mouseY >= cfg.critY && mouseY <= cfg.critY + cfg.critSize) {
                      dragging = true; dragX = (int) mouseX - cfg.critX; dragY = (int) mouseY - cfg.critY; return true;
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              @Override
              public boolean mouseDragged(double mouseX, double mouseY, int button, double dragX, double dragY) {
                  if (dragging) { ModConfig.INSTANCE.critX = (int) mouseX - this.dragX; ModConfig.INSTANCE.critY = (int) mouseY - this.dragY; return true; }
                  return super.mouseDragged(mouseX, mouseY, button, dragX, dragY);
              }

              @Override
              public boolean mouseReleased(double mouseX, double mouseY, int button) {
                  if (dragging) { dragging = false; ModConfig.save(); }
                  return super.mouseReleased(mouseX, mouseY, button);
              }

              @Override
              public boolean isPauseScreen() { return false; }

              private static class SliderWidget extends AbstractSliderButton {
                  private final java.util.function.LongConsumer onChange;
                  private final String prefix; private final long min, max;
                  public SliderWidget(int x, int y, int w, int h, String prefix, long current, long min, long max, java.util.function.LongConsumer onChange) {
                      super(x, y, w, h, Component.empty(), (double) (current - min) / (max - min));
                      this.onChange = onChange; this.prefix = prefix; this.min = min; this.max = max; updateMessage();
                  }
                  @Override protected void updateMessage() { long val = Math.round(min + (max - min) * this.value); this.setMessage(Component.literal(prefix + ": §e" + val)); }
                  @Override protected void applyValue() { onChange.accept(Math.round(min + (max - min) * this.value)); }
              }
          }
          EOF
