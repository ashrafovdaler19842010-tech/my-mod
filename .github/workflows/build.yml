name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.AuraModClient/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          cat << 'EOF' > src/client/java/com/example/client/AuraModClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class AuraModClient implements ClientModInitializer {

              private static boolean auraEnabled = false;
              private static boolean xKeyWasDown = false;
              private static long lastAttackTime = 0;
              private static int attackDelay = 150;

              @Override
              public void onInitializeClient() {
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();

                      // Обработка нажатия X (код 88)
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown) {
                          auraEnabled = !auraEnabled;
                          // Звук вкл/выкл
                          client.player.playSound(auraEnabled ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
                      }
                      xKeyWasDown = xDown;

                      // Если килка выключена или открыт инвентарь - ничего не делаем
                      if (!auraEnabled || client.screen != null) return;

                      // Проверка кулдауна атаки (чтобы не спамить)
                      if (client.player.getAttackStrengthScale(0.5f) < 1.0f) return;
                      if (System.currentTimeMillis() - lastAttackTime < attackDelay) return;

                      // Ищем цель
                      LivingEntity target = getClosestEntity(client, 3.5f);
                      if (target == null) return;

                      // 1. СБРОС СПРИНТА (Обход Grim/Matrix для крита)
                      if (client.player.isSprinting()) {
                          client.player.connection.send(new ServerboundPlayerCommandPacket(client.player, ServerboundPlayerCommandPacket.Action.STOP_SPRINTING));
                      }

                      // 2. МАТЕМАТИКА ПОВОРОТА (Обход Polar GCD)
                      float[] rots = getRotations(client.player, target);
                      float targetYaw = rots[0];
                      float targetPitch = rots[1];
                      
                      // Сохраняем текущие углы (Freelook)
                      float oldYaw = client.player.getYRot();
                      float oldPitch = client.player.getXRot();

                      // 3. ОТПРАВЛЯЕМ ПАКЕТ ПОВОРОТА (Тихая наводка)
                      client.player.connection.send(new ServerboundMovePlayerPacket.Rot(targetYaw, targetPitch, client.player.onGround(), false));

                      // 4. БЬЕМ
                      if (client.gameMode != null) {
                          client.gameMode.attack(client.player, target);
                          client.player.swing(InteractionHand.MAIN_HAND);
                      }

                      // 5. ВОЗВРАЩАЕМ ПАКЕТ ОБРАТНО (Чтобы сервер не спалил)
                      client.player.connection.send(new ServerboundMovePlayerPacket.Rot(oldYaw, oldPitch, client.player.onGround(), false));

                      // Рандомизация CPS (от 100 до 250 мс)
                      lastAttackTime = System.currentTimeMillis();
                      attackDelay = 100 + (int)(Math.random() * 150);
                  });
              }

              // Поиск ближайшей цели
              private static LivingEntity getClosestEntity(Minecraft mc, float range) {
                  LivingEntity best = null;
                  double bestDist = range;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !(e instanceof LivingEntity) || !e.isAlive()) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= bestDist) {
                          bestDist = dist;
                          best = (LivingEntity) e;
                      }
                  }
                  return best;
              }

              // Вычисление углов + обход античитов (Jitter + GCD)
              private static float[] getRotations(LivingEntity player, LivingEntity target) {
                  Vec3 eye = player.getEyePosition();
                  Vec3 pos = target.position().add(0, target.getBbHeight() * 0.5, 0); // Бьем в тело

                  double dx = pos.x - eye.x;
                  double dy = pos.y - eye.y;
                  double dz = pos.z - eye.z;
                  double dist = Math.sqrt(dx * dx + dz * dz);

                  float yaw = (float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F;
                  float pitch = (float)(-(Math.atan2(dy, dist) * 180.0 / Math.PI));

                  // МИКРО-ШУМ (Обход Polar/Grim на идеальные углы)
                  yaw += (Math.random() - 0.5) * 0.4f;
                  pitch += (Math.random() - 0.5) * 0.4f;

                  return new float[]{yaw, Mth.clamp(pitch, -90.0f, 90.0f)};
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
