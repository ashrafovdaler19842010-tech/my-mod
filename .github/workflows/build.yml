name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Unzip template
        run: unzip -o mod.zip || true

      - name: Configure Project & Copy Sources
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=1.21.8/' gradle.properties
          sed -i 's/^fabric_loader_version=.*/fabric_loader_version=0.16.9/' gradle.properties
          sed -i 's/^yarn_mappings=.*/yarn_mappings=1.21.8+build.1/' gradle.properties
          sed -i 's/^fabric_version=.*/fabric_version=0.129.0+1.21.8/' gradle.properties

          rm -rf src/main/java/*
          mkdir -p src/main/java/com/auctionbot/mixin
          mkdir -p src/main/resources

          cp BotConfig.java PriceParser.java MarketScanner.java AuctionSniper.java BotConfigScreen.java AuctionBotClient.java src/main/java/com/auctionbot/
          cp ClientPlayNetworkHandlerMixin.java src/main/java/com/auctionbot/mixin/

          cat << 'EOF' > src/main/resources/auctionbot.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.auctionbot.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "ClientPlayNetworkHandlerMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "auctionbot",
            "version": "1.0.0",
            "name": "AuctionBot",
            "description": "Auto market scanner and auction sniper for 1.21.8",
            "authors": ["ashrafovdaler19842010-tech"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.auctionbot.AuctionBotClient"
              ]
            },
            "mixins": [
              "auctionbot.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.8",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          gradle build --no-daemon

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: AuctionBot-1.21.8
          path: build/libs/*.jar
