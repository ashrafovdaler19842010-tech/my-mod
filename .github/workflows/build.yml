        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
