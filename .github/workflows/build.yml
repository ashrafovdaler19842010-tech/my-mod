name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.CombatUtilsClient/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          cat << 'EOF' > src/client/java/com/example/client/ModConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.world.item.ItemStack;

          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          import java.util.HashMap;
          import java.util.Map;

          public class ModConfig {
              private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "combat-utils.json");

              public boolean sprintEnabled = true;
              public boolean critOnly = true;
              public boolean autoSprint = true;
              public String sprintMode = "W_TAP";
              public long startDelayMs = 15;
              public long holdDurationMs = 55;

              public boolean critEnabled = true;
              public int critX = 10, critY = 10, critSize = 15;
              public String pinkColor = "#FF69B4", whiteColor = "#FFFFFF", redColor = "#FF0000";

              // Triggerbot
              public boolean triggerbotEnabled = false;
              public int triggerbotKey = 67; // C
              public int triggerDelayMs = 10;
              public float triggerFov = 30.0f;
              public float triggerMinDist = 1.0f;
              public float triggerMaxDist = 3.0f;

              // Aim Assist
              public boolean aimAssistEnabled = false;
              public int aimKey = 86; // V
              public int aimMode = 100; // 0 = Legit, 100 = Rage
              public float aimSpeed = 1.0f;
              public float aimSmoothness = 1.0f;
              public float aimJitter = 0.0f;
              public boolean aimRandomPoint = true;
              public boolean freelookEnabled = false;

              public int saveLayoutKey = 79; // O
              public int sortInventoryKey = 80; // P
              public int copyChestKey = 67; // C
              public long sortSpeedMs = 100;

              public transient Map<Integer, ItemStack> savedLayout = new HashMap<>();

              public static ModConfig INSTANCE = new ModConfig();

              public static void save() {
                  try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                      new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, writer);
                  } catch (Exception ignored) {}
              }

              public static void load() {
                  if (CONFIG_FILE.exists()) {
                      try (FileReader reader = new FileReader(CONFIG_FILE)) {
                          ModConfig loaded = new Gson().fromJson(reader, ModConfig.class);
                          if (loaded != null) {
                              INSTANCE = loaded;
                              if (INSTANCE.savedLayout == null) INSTANCE.savedLayout = new HashMap<>();
                          }
                      } catch (Exception ignored) {}
                  }
              }

              public static int parseHexColor(String hex) {
                  try {
                      String clean = hex.replace("#", "").trim();
                      if (clean.length() == 6) return 0xFF000000 | Integer.parseInt(clean, 16);
                  } catch (Exception ignored) {}
                  return 0xFFFFFFFF;
              }
          }
          EOF

          cat << 'EOF' > src/client/java/com/example/client/CombatUtilsClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.inventory.InventoryScreen;
          import net.minecraft.client.gui.screens.inventory.AbstractContainerScreen;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.core.component.DataComponents;
          import net.minecraft.network.chat.Component;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.component.ItemLore;
          import net.minecraft.world.item.enchantment.ItemEnchantments;
          import net.minecraft.world.inventory.ClickType;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class CombatUtilsClient implements ClientModInitializer {

              private static boolean rCtrlWasDown = false;
              private static boolean resetting = false;
              private static long resetStart = 0, resetEnd = 0;

              private static boolean isSorting = false;
              private static int sortStep = 0;
              private static int sortSourceSlot = -1;
              private static int sortTargetSlot = -1;
              private static long nextSortActionTime = 0;

              private static boolean triggerbotToggled = false;
              private static boolean canTrigger = true;
              private static int triggerState = 0;
              private static long triggerTimer = 0;

              private static boolean aimAssistActive = false;
              private static float oldYaw = 0, oldPitch = 0;

              @Override
              public void onInitializeClient() {
                  ModConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      ModConfig cfg = ModConfig.INSTANCE;

                      // Меню
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof ModConfigScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new ModConfigScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // Toggle Triggerbot
                      if (InputConstants.isKeyDown(win, cfg.triggerbotKey) && client.screen == null) {
                          if (!rCtrlWasDown) { 
                              triggerbotToggled = !triggerbotToggled;
                              client.player.displayClientMessage(Component.literal("Triggerbot: " + (triggerbotToggled ? "§aON" : "§cOFF")), true);
                              rCtrlWasDown = true; 
                          }
                      } else if (!InputConstants.isKeyDown(win, cfg.triggerbotKey)) {
                          rCtrlWasDown = false;
                      }

                      // --- AIM ASSIST & FREELOOK ---
                      boolean aimKeyDown = InputConstants.isKeyDown(win, cfg.aimKey);
                      Entity target = client.crosshairPickEntity;

                      if (cfg.aimAssistEnabled && client.screen == null && target instanceof LivingEntity livingTarget) {
                          if (aimKeyDown) {
                              if (!aimAssistActive) {
                                  aimAssistActive = true;
                                  oldYaw = client.player.getYRot();
                                  oldPitch = client.player.getXRot();
                              }

                              // Проверка FOV (чтобы не наводиться на тех, кто за спиной)
                              Vec3 lookVec = client.player.getLookAngle();
                              Vec3 targetVec = livingTarget.getEyePosition().subtract(client.player.getEyePosition()).normalize();
                              double dot = lookVec.dot(targetVec);
                              double angle = Math.toDegrees(Math.acos(dot));

                              if (angle <= cfg.triggerFov) {
                                  Vec3 targetPos = livingTarget.getEyePosition();
                                  if (cfg.aimRandomPoint) {
                                      // Рандомная точка по высоте тела (от колен до головы)
                                      double randomY = livingTarget.getY() + (livingTarget.getBbHeight() * (0.3 + Math.random() * 0.6));
                                      targetPos = new Vec3(livingTarget.getX(), randomY, livingTarget.getZ());
                                  }

                                  double dx = targetPos.x - client.player.getEyePosition().x;
                                  double dy = targetPos.y - client.player.getEyePosition().y;
                                  double dz = targetPos.z - client.player.getEyePosition().z;
                                  double distXZ = Math.sqrt(dx * dx + dz * dz);

                                  float targetYaw = (float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F;
                                  float targetPitch = (float)(-(Math.atan2(dy, distXZ) * 180.0 / Math.PI));

                                  // Legit vs Rage (0% = медленно, 100% = мгновенно)
                                  float legitMod = cfg.aimMode / 100.0f;
                                  
                                  // Smoothness влияет на скорость поворота
                                  float yawStep = (targetYaw - client.player.getYRot()) / Math.max(1.0f, (10.0f - cfg.aimSmoothness * 9.0f));
                                  float pitchStep = (targetPitch - client.player.getXRot()) / Math.max(1.0f, (10.0f - cfg.aimSmoothness * 9.0f));

                                  // Jitter (дрожание)
                                  float jitterY = (float) ((Math.random() - 0.5) * cfg.aimJitter);
                                  float jitterX = (float) ((Math.random() - 0.5) * cfg.aimJitter);

                                  // Применяем скорость
                                  float finalYaw = client.player.getYRot() + (yawStep * cfg.aimSpeed * legitMod) + jitterY;
                                  float finalPitch = client.player.getXRot() + (pitchStep * cfg.aimSpeed * legitMod) + jitterX;

                                  client.player.setYRot(finalYaw);
                                  client.player.setXRot(Mth.clamp(finalPitch, -90.0f, 90.0f));
                              }
                          } else if (aimAssistActive) {
                              // Если Freelook включен, возвращаем камеру обратно
                              if (cfg.freelookEnabled) {
                                  client.player.setYRot(oldYaw);
                                  client.player.setXRot(oldPitch);
                              }
                              aimAssistActive = false;
                          }
                      }

                      // --- TRIGGERBOT LOGIC ---
                      if (cfg.triggerbotEnabled && triggerbotToggled && client.screen == null) {
                          if (client.player.onGround()) {
                              canTrigger = true;
                          }

                          if (canTrigger && client.player.fallDistance > 0.0F && target != null) {
                              float dist = client.player.distanceTo(target);
                              
                              // Проверка дистанции
                              if (dist >= cfg.triggerMinDist && dist <= cfg.triggerMaxDist) {
                                  // Проверка FOV
                                  Vec3 lookVec = client.player.getLookAngle();
                                  Vec3 targetVec = target.getEyePosition().subtract(client.player.getEyePosition()).normalize();
                                  double angle = Math.toDegrees(Math.acos(lookVec.dot(targetVec)));

                                  if (angle <= cfg.triggerFov) {
                                      if (triggerState == 0) {
                                          // Сброс спринта
                                          if (cfg.sprintMode.equals("W_TAP")) client.options.keyUp.setDown(false);
                                          else if (cfg.sprintMode.equals("S_TAP")) { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                                          else if (cfg.sprintMode.equals("SPRINT")) client.options.keySprint.setDown(false);
                                          
                                          triggerState = 1;
                                          triggerTimer = System.currentTimeMillis() + cfg.triggerDelayMs;
                                      } 
                                      else if (triggerState == 1 && System.currentTimeMillis() >= triggerTimer) {
                                          if (client.gameMode != null && target.isAlive()) {
                                              client.gameMode.attack(client.player, target);
                                              client.player.swing(InteractionHand.MAIN_HAND);
                                              client.player.resetAttackStrengthTicker();
                                          }
                                          restoreKeys(client);
                                          canTrigger = false;
                                          triggerState = 0;
                                      }
                                  }
                              }
                          } else if (triggerState == 1) {
                              restoreKeys(client);
                              triggerState = 0;
                          }
                      }

                      // --- AUTO SPRINT LOGIC ---
                      long now = System.currentTimeMillis();
                      boolean activeReset = false;
                      if (cfg.sprintEnabled && resetting) {
                          if (now >= resetStart && now <= resetEnd) {
                              activeReset = true;
                              if (cfg.sprintMode.equals("W_TAP")) client.options.keyUp.setDown(false);
                              else if (cfg.sprintMode.equals("S_TAP")) { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                              else if (cfg.sprintMode.equals("SPRINT")) client.options.keySprint.setDown(false);
                          } else if (now > resetEnd) {
                              restoreKeys(client);
                              resetting = false;
                          }
                      }

                      if (cfg.autoSprint && client.screen == null && !activeReset && triggerState == 0) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) {
                              client.options.keySprint.setDown(true);
                          } else {
                              restoreKeys(client);
                          }
                      }

                      // --- UTILS ---
                      if (InputConstants.isKeyDown(win, cfg.saveLayoutKey) && client.screen == null) {
                          cfg.savedLayout.clear();
                          for (int i = 0; i < 36; i++) {
                              ItemStack stack = client.player.getInventory().getItem(i);
                              if (!stack.isEmpty()) cfg.savedLayout.put(i, stack.copy());
                          }
                          client.player.displayClientMessage(Component.literal("§aРаскладка сохранена!"), true);
                          ModConfig.save();
                      }

                      if (InputConstants.isKeyDown(win, cfg.sortInventoryKey) && client.screen instanceof InventoryScreen && !isSorting) {
                          startSorting();
                      }

                      if (isSorting) {
                          tickSort(client, cfg);
                      }

                      if (InputConstants.isKeyDown(win, cfg.copyChestKey) && client.screen instanceof AbstractContainerScreen<?> hs && !triggerbotToggled) {
                          copyChestInfo(client, hs);
                      }
                  });

                  HudRenderCallback.EVENT.register((context, tickCounter) -> renderHud(context));
              }

              private static void restoreKeys(Minecraft client) {
                  long win = client.getWindow().getWindow();
                  InputConstants.Key upKey = InputConstants.getKey(client.options.keyUp.saveString());
                  client.options.keyUp.setDown(InputConstants.isKeyDown(win, upKey.getValue()));

                  InputConstants.Key downKey = InputConstants.getKey(client.options.keyDown.saveString());
                  client.options.keyDown.setDown(InputConstants.isKeyDown(win, downKey.getValue()));

                  InputConstants.Key sprintKey = InputConstants.getKey(client.options.keySprint.saveString());
                  client.options.keySprint.setDown(InputConstants.isKeyDown(win, sprintKey.getValue()));
              }

              private static void renderHud(GuiGraphics context) {
                  Minecraft mc = Minecraft.getInstance();
                  LocalPlayer player = mc.player;
                  if (player == null || mc.options.hideGui) return;
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (!cfg.critEnabled) return;

                  boolean falling = player.fallDistance > 0.0F && !player.onGround() && !player.onClimbable() && !player.isInWater();
                  boolean inWater = player.isInWater();
                  double dist = 100.0;

                  Entity target = mc.crosshairPickEntity;
                  if (target != null) {
                      dist = player.distanceTo(target);
                  }

                  int color = ModConfig.parseHexColor(cfg.whiteColor);
                  if (dist <= 3.0) {
                      if (inWater) color = ModConfig.parseHexColor(cfg.redColor);
                      else if (falling) color = ModConfig.parseHexColor(cfg.pinkColor);
                  }

                  context.fill(cfg.critX, cfg.critY, cfg.critX + cfg.critSize, cfg.critY + cfg.critSize, color);
                  context.renderOutline(cfg.critX - 1, cfg.critY - 1, cfg.critSize + 2, cfg.critSize + 2, 0xFF000000);
              }

              private static void startSorting() {
                  isSorting = true;
                  sortStep = 0;
                  nextSortActionTime = System.currentTimeMillis();
              }

              private static void tickSort(Minecraft mc, ModConfig cfg) {
                  if (!(mc.screen instanceof InventoryScreen) || mc.player == null || mc.gameMode == null) {
                      isSorting = false;
                      return;
                  }

                  if (System.currentTimeMillis() < nextSortActionTime) return;

                  int syncId = mc.player.inventoryMenu.containerId;

                  if (sortStep == 0) {
                      boolean found = false;
                      for (int targetSlot = 0; targetSlot < 36; targetSlot++) {
                          ItemStack saved = cfg.savedLayout.get(targetSlot);
                          if (saved == null) continue;

                          ItemStack current = mc.player.getInventory().getItem(targetSlot);
                          if (ItemStack.isSameItemSameComponents(current, saved)) continue;

                          for (int sourceSlot = 0; sourceSlot < 36; sourceSlot++) {
                              if (sourceSlot == targetSlot) continue;
                              ItemStack check = mc.player.getInventory().getItem(sourceSlot);
                              if (ItemStack.isSameItemSameComponents(check, saved)) {
                                  sortSourceSlot = sourceSlot;
                                  sortTargetSlot = targetSlot;
                                  found = true;
                                  break;
                              }
                          }
                          if (found) break;
                      }

                      if (!found) {
                          isSorting = false;
                          return;
                      }

                      mc.gameMode.handleInventoryMouseClick(syncId, getMenuSlot(sortSourceSlot), 0, ClickType.PICKUP, mc.player);
                      sortStep = 1;
                      nextSortActionTime = System.currentTimeMillis() + cfg.sortSpeedMs;
                  }
                  else if (sortStep == 1) {
                      mc.gameMode.handleInventoryMouseClick(syncId, getMenuSlot(sortTargetSlot), 0, ClickType.PICKUP, mc.player);
                      sortStep = 2;
                      nextSortActionTime = System.currentTimeMillis() + cfg.sortSpeedMs;
                  }
                  else if (sortStep == 2) {
                      mc.gameMode.handleInventoryMouseClick(syncId, getMenuSlot(sortSourceSlot), 0, ClickType.PICKUP, mc.player);
                      sortStep = 0;
                      nextSortActionTime = System.currentTimeMillis() + cfg.sortSpeedMs;
                  }
              }

              private static int getMenuSlot(int invSlot) {
                  if (invSlot < 9) return 36 + invSlot;
                  return invSlot;
              }

              private static void copyChestInfo(Minecraft mc, AbstractContainerScreen<?> screen) {
                  StringBuilder sb = new StringBuilder("=== Содержимое контейнера ===\n");
                  int chestSize = screen.getMenu().slots.size();
                  
                  for (int i = 0; i < chestSize; i++) {
                      ItemStack stack = screen.getMenu().getSlot(i).getItem();
                      if (stack.isEmpty()) continue;

                      sb.append("Слот ").append(i).append(": ")
                        .append(stack.getHoverName().getString())
                        .append(" x").append(stack.getCount());

                      if (stack.isDamageableItem() && stack.isDamaged()) {
                          sb.append(" | Прочность: ").append(stack.getMaxDamage() - stack.getDamageValue()).append("/").append(stack.getMaxDamage());
                      }

                      if (stack.isEnchanted()) {
                          sb.append(" | Зачарования: ");
                          ItemEnchantments enchants = stack.getEnchantments();
                          enchants.entrySet().forEach(entry -> {
                              sb.append(entry.getKey().value().description().getString())
                                .append(" ").append(entry.getIntValue()).append(", ");
                          });
                      }

                      ItemLore lore = stack.get(DataComponents.LORE);
                      if (lore != null && !lore.lines().isEmpty()) {
                          sb.append(" | Lore: ");
                          lore.lines().forEach(line -> sb.append(line.getString()).append(" "));
                      }

                      if (stack.has(DataComponents.CUSTOM_DATA)) {
                          sb.append(" | NBT: ").append(stack.get(DataComponents.CUSTOM_DATA).copyTag().toString());
                      }
                      sb.append("\n");
                  }

                  mc.keyboardHandler.setClipboard(sb.toString());
                  if (mc.player != null) mc.player.displayClientMessage(Component.literal("§aИнфа о сундуке скопирована!"), true);
              }
          }
          EOF

          cat << 'EOF' > src/client/java/com/example/client/ModConfigScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.AbstractSliderButton;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class ModConfigScreen extends Screen {
              private int tab = 0;
              private boolean dragging = false;
              private int dragX, dragY;

              public ModConfigScreen() { super(Component.literal("Combat Utils")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  ModConfig cfg = ModConfig.INSTANCE;
                  int x = this.width / 2 - 140, y = this.height / 2 - 120;

                  this.addRenderableWidget(Button.builder(Component.literal(tab == 0 ? "§b[Spr]" : "Spr"), b -> { tab = 0; init(); }).bounds(x + 5, y + 25, 50, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 1 ? "§b[Crit]" : "Crit"), b -> { tab = 1; init(); }).bounds(x + 58, y + 25, 50, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 2 ? "§b[Trig]" : "Trig"), b -> { tab = 2; init(); }).bounds(x + 111, y + 25, 50, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 3 ? "§b[Aim]" : "Aim"), b -> { tab = 3; init(); }).bounds(x + 164, y + 25, 50, 20).build());
                  this.addRenderableWidget(Button.builder(Component.literal(tab == 4 ? "§b[Util]" : "Util"), b -> { tab = 4; init(); }).bounds(x + 217, y + 25, 50, 20).build());

                  if (tab == 0) {
                      this.addRenderableWidget(Button.builder(Component.literal("Sprint: " + (cfg.sprintEnabled ? "§aON" : "§cOFF")), b -> { cfg.sprintEnabled = !cfg.sprintEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("AutoSprint: " + (cfg.autoSprint ? "§aON" : "§cOFF")), b -> { cfg.autoSprint = !cfg.autoSprint; ModConfig.save(); init(); }).bounds(x + 10, y + 80, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Crit Only: " + (cfg.critOnly ? "§aON" : "§cOFF")), b -> { cfg.critOnly = !cfg.critOnly; ModConfig.save(); init(); }).bounds(x + 10, y + 105, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Mode: §e" + cfg.sprintMode), b -> { 
                          if (cfg.sprintMode.equals("W_TAP")) cfg.sprintMode = "S_TAP";
                          else if (cfg.sprintMode.equals("S_TAP")) cfg.sprintMode = "SPRINT";
                          else cfg.sprintMode = "W_TAP";
                          ModConfig.save(); init();
                      }).bounds(x + 10, y + 130, 260, 20).build());
                  } else if (tab == 1) {
                      this.addRenderableWidget(Button.builder(Component.literal("Crit Square: " + (cfg.critEnabled ? "§aON" : "§cOFF")), b -> { cfg.critEnabled = !cfg.critEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      EditBox pinkBox = new EditBox(this.font, x + 100, y + 85, 170, 18, Component.literal("Pink"));
                      pinkBox.setValue(cfg.pinkColor);
                      this.addRenderableWidget(pinkBox);
                      EditBox redBox = new EditBox(this.font, x + 100, y + 110, 170, 18, Component.literal("Red"));
                      redBox.setValue(cfg.redColor);
                      this.addRenderableWidget(redBox);
                      EditBox sizeBox = new EditBox(this.font, x + 100, y + 135, 170, 18, Component.literal("Size"));
                      sizeBox.setValue(String.valueOf(cfg.critSize));
                      this.addRenderableWidget(sizeBox);
                      this.addRenderableWidget(Button.builder(Component.literal("§aSave Colors"), b -> {
                          cfg.pinkColor = pinkBox.getValue();
                          cfg.redColor = redBox.getValue();
                          try { cfg.critSize = Integer.parseInt(sizeBox.getValue()); } catch (Exception ignored) {}
                          ModConfig.save(); init();
                      }).bounds(x + 10, y + 160, 260, 20).build());
                  } else if (tab == 2) {
                      this.addRenderableWidget(Button.builder(Component.literal("Triggerbot: " + (cfg.triggerbotEnabled ? "§aON" : "§cOFF")), b -> { cfg.triggerbotEnabled = !cfg.triggerbotEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 80, 260, 20, "Delay (ms)", cfg.triggerDelayMs, 0, 200, val -> { cfg.triggerDelayMs = (int)val; ModConfig.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 105, 260, 20, "FOV (Angle)", (long)cfg.triggerFov, 10, 180, val -> { cfg.triggerFov = (float)val; ModConfig.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 130, 260, 20, "Min Dist", (long)(cfg.triggerMinDist*10), 10, 60, val -> { cfg.triggerMinDist = val / 10f; ModConfig.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 155, 260, 20, "Max Dist", (long)(cfg.triggerMaxDist*10), 10, 60, val -> { cfg.triggerMaxDist = val / 10f; ModConfig.save(); }));
                  } else if (tab == 3) {
                      this.addRenderableWidget(Button.builder(Component.literal("Aim Assist: " + (cfg.aimAssistEnabled ? "§aON" : "§cOFF")), b -> { cfg.aimAssistEnabled = !cfg.aimAssistEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Freelook (Hold): " + (cfg.freelookEnabled ? "§aON" : "§cOFF")), b -> { cfg.freelookEnabled = !cfg.freelookEnabled; ModConfig.save(); init(); }).bounds(x + 10, y + 80, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Random Point: " + (cfg.aimRandomPoint ? "§aON" : "§cOFF")), b -> { cfg.aimRandomPoint = !cfg.aimRandomPoint; ModConfig.save(); init(); }).bounds(x + 10, y + 105, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 130, 260, 20, "Legit(0)-Rage(100)", cfg.aimMode, 0, 100, val -> { cfg.aimMode = (int)val; ModConfig.save(); }));
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 155, 260, 20, "Speed", (long)(cfg.aimSpeed*10), 1, 50, val -> { cfg.aimSpeed = val / 10f; ModConfig.save(); }));
                  } else {
                      this.addRenderableWidget(Button.builder(Component.literal("Save Bind: §e" + (char)cfg.saveLayoutKey), b -> {}).bounds(x + 10, y + 55, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Sort Bind: §e" + (char)cfg.sortInventoryKey), b -> {}).bounds(x + 10, y + 80, 260, 20).build());
                      this.addRenderableWidget(Button.builder(Component.literal("Copy Chest Bind: §e" + (char)cfg.copyChestKey), b -> {}).bounds(x + 10, y + 105, 260, 20).build());
                      this.addRenderableWidget(new SliderWidget(x + 10, y + 130, 260, 20, "Sort Speed", cfg.sortSpeedMs, 30, 300, val -> { cfg.sortSpeedMs = val; ModConfig.save(); }));
                  }
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  ModConfig cfg = ModConfig.INSTANCE;
                  int x = this.width / 2 - 140, y = this.height / 2 - 120;
                  context.fill(x - 1, y - 1, x + 271, y + 221, 0xFF00E5FF);
                  context.fill(x, y, x + 270, y + 220, 0xE612151E);
                  context.drawCenteredString(this.font, "§b§lCombat Utils", x + 135, y + 10, 0xFFFFFF);
                  
                  if (tab == 1) {
                      context.drawString(this.font, "Pink:", x + 10, y + 90, 0xFF69B4, false);
                      context.drawString(this.font, "Red:", x + 10, y + 115, 0xFF0000, false);
                      context.drawString(this.font, "Size:", x + 10, y + 140, 0xFFFFFF, false);
                      context.fill(cfg.critX, cfg.critY, cfg.critX + cfg.critSize, cfg.critY + cfg.critSize, ModConfig.parseHexColor(cfg.whiteColor));
                      context.renderOutline(cfg.critX - 1, cfg.critY - 1, cfg.critSize + 2, cfg.critSize + 2, 0xFFFFFFFF);
                  } else if (tab == 3) {
                      context.drawString(this.font, "Aim Speed:", x + 10, y + 160, 0xFFFFFF, false);
                      context.drawString(this.font, "Mod:", x + 10, y + 135, 0xFFFFFF, false);
                  }
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (tab == 1 && button == 0 && mouseX >= cfg.critX && mouseX <= cfg.critX + cfg.critSize && mouseY >= cfg.critY && mouseY <= cfg.critY + cfg.critSize) {
                      dragging = true;
                      dragX = (int) mouseX - cfg.critX;
                      dragY = (int) mouseY - cfg.critY;
                      return true;
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              @Override
              public boolean mouseDragged(double mouseX, double mouseY, int button, double dragX, double dragY) {
                  if (dragging) {
                      ModConfig.INSTANCE.critX = (int) mouseX - this.dragX;
                      ModConfig.INSTANCE.critY = (int) mouseY - this.dragY;
                      return true;
                  }
                  return super.mouseDragged(mouseX, mouseY, button, dragX, dragY);
              }

              @Override
              public boolean mouseReleased(double mouseX, double mouseY, int button) {
                  if (dragging) { dragging = false; ModConfig.save(); }
                  return super.mouseReleased(mouseX, mouseY, button);
              }

              @Override
              public boolean isPauseScreen() { return false; }

              private static class SliderWidget extends AbstractSliderButton {
                  private final java.util.function.LongConsumer onChange;
                  private final String prefix;
                  private final long min, max;

                  public SliderWidget(int x, int y, int w, int h, String prefix, long current, long min, long max, java.util.function.LongConsumer onChange) {
                      super(x, y, w, h, Component.empty(), (double) (current - min) / (max - min));
                      this.onChange = onChange;
                      this.prefix = prefix;
                      this.min = min;
                      this.max = max;
                      updateMessage();
                  }
                  @Override
                  protected void updateMessage() {
                      long val = Math.round(min + (max - min) * this.value);
                      this.setMessage(Component.literal(prefix + ": §e" + val));
                  }
                  @Override
                  protected void applyValue() {
                      onChange.accept(Math.round(min + (max - min) * this.value));
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
