name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          cat << 'EOF' > src/client/java/com/example/client/ModConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class ModConfig {
              private static final File CONFIG_FILE = new File(
                      FabricLoader.getInstance().getConfigDir().toFile(),
                      "sprint-esp.json"
              );

              public enum ResetMode {
                  W_TAP("W-TAP (Отпустить W)"),
                  S_TAP("S-TAP (Нажать S)"),
                  SPRINT_KEY("SPRINT (Сброс Ctrl)");

                  public final String label;
                  ResetMode(String label) { this.label = label; }

                  public ResetMode next() {
                      ResetMode[] vals = values();
                      return vals[(this.ordinal() + 1) % vals.length];
                  }
              }

              public boolean sprintEnabled = true;
              public boolean critOnly = true;
              public boolean autoSprint = true;
              public boolean showSprintHud = true;
              public ResetMode currentMode = ResetMode.W_TAP;
              public long startDelayMs = 15;
              public long holdDurationMs = 55;

              public boolean hitboxEnabled = true;
              public boolean hitboxOutline = true;
              public String hitboxColor = "#00E5FF";
              public int hitboxAlpha = 70;

              public boolean velocityHudEnabled = false;
              public int velX = 10;
              public int velY = 60;
              public int velSize = 12;
              public String upColor = "#FF5555";
              public String fallColor = "#FF69B4";
              public String idleColor = "#FFFF00";

              public static ModConfig INSTANCE = new ModConfig();

              public static void save() {
                  try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                      new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, writer);
                  } catch (Exception ignored) {}
              }

              public static void load() {
                  if (CONFIG_FILE.exists()) {
                      try (FileReader reader = new FileReader(CONFIG_FILE)) {
                          ModConfig loaded = new Gson().fromJson(reader, ModConfig.class);
                          if (loaded != null) {
                              if (loaded.currentMode == null) loaded.currentMode = ResetMode.W_TAP;
                              if (loaded.hitboxColor == null) loaded.hitboxColor = "#00E5FF";
                              if (loaded.upColor == null) loaded.upColor = "#FF5555";
                              if (loaded.fallColor == null) loaded.fallColor = "#FF69B4";
                              if (loaded.idleColor == null) loaded.idleColor = "#FFFF00";
                              INSTANCE = loaded;
                          }
                      } catch (Exception ignored) {}
                  }
              }

              public static int parseRgb(String hex) {
                  try {
                      String clean = hex.replace("#", "").trim();
                      if (clean.length() == 6) {
                          return Integer.parseInt(clean, 16);
                      }
                  } catch (Exception ignored) {}
                  return 0x00E5FF;
              }

              public static int parseHexColor(String hex, int alpha) {
                  return ((alpha & 0xFF) << 24) | parseRgb(hex);
              }
          }
          EOF
          cat << 'EOF' > src/client/java/com/example/client/TemplateModClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import com.mojang.blaze3d.systems.RenderSystem;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.ShapeRenderer;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import org.joml.Matrix4f;
          import org.lwjgl.glfw.GLFW;

          public class TemplateModClient implements ClientModInitializer {

              private static long resetStartTime = 0;
              private static long resetEndTime = 0;
              private static boolean isResetting = false;
              private static boolean rCtrlWasDown = false;

              @Override
              public void onInitializeClient() {
                  ModConfig.load();

                  AttackEntityCallback.EVENT.register((player, level, hand, entity, hitResult) -> {
                      ModConfig cfg = ModConfig.INSTANCE;
                      Minecraft mc = Minecraft.getInstance();
                      if (!cfg.sprintEnabled || !level.isClientSide || player != mc.player) {
                          return InteractionResult.PASS;
                      }

                      boolean isCritState = !player.onGround()
                              && player.fallDistance > 0.0F
                              && !player.onClimbable()
                              && !player.isInWater()
                              && !player.isPassenger();

                      if (!cfg.critOnly || isCritState) {
                          if (player.isSprinting() || cfg.autoSprint) {
                              long now = System.currentTimeMillis();
                              resetStartTime = now + cfg.startDelayMs;
                              resetEndTime = resetStartTime + cfg.holdDurationMs;
                              isResetting = true;
                          }
                      }
                      return InteractionResult.PASS;
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;

                      long windowHandle = client.getWindow().getWindow();
                      boolean rCtrlDown = InputConstants.isKeyDown(windowHandle, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrlDown && !rCtrlWasDown) {
                          if (client.screen instanceof ModConfigScreen) {
                              client.setScreen(null);
                          } else if (client.screen == null) {
                              client.setScreen(new ModConfigScreen());
                          }
                      }
                      rCtrlWasDown = rCtrlDown;

                      ModConfig cfg = ModConfig.INSTANCE;
                      long now = System.currentTimeMillis();
                      boolean activeResetPhase = false;

                      if (cfg.sprintEnabled && isResetting) {
                          if (now >= resetStartTime && now <= resetEndTime) {
                              activeResetPhase = true;
                              applyResetAction(client, cfg.currentMode, true);
                          } else if (now > resetEndTime) {
                              applyResetAction(client, cfg.currentMode, false);
                              isResetting = false;
                          }
                      }

                      if (cfg.autoSprint && client.screen == null && !activeResetPhase) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) {
                              client.options.keySprint.setDown(true);
                          } else {
                              restorePhysicalKeyState(client, client.options.keySprint);
                          }
                      }
                  });
                  HudRenderCallback.EVENT.register((guiGraphics, tickCounter) -> renderHud(guiGraphics));
                  WorldRenderEvents.AFTER_TRANSLUCENT.register(TemplateModClient::renderPlayerHitboxes);
              }

              private void applyResetAction(Minecraft client, ModConfig.ResetMode mode, boolean active) {
                  switch (mode) {
                      case W_TAP -> {
                          if (active) client.options.keyUp.setDown(false);
                          else restorePhysicalKeyState(client, client.options.keyUp);
                      }
                      case S_TAP -> {
                          if (active) {
                              client.options.keyUp.setDown(false);
                              client.options.keyDown.setDown(true);
                          } else {
                              restorePhysicalKeyState(client, client.options.keyUp);
                              restorePhysicalKeyState(client, client.options.keyDown);
                          }
                      }
                      case SPRINT_KEY -> {
                          if (active) {
                              if (client.player != null) client.player.setSprinting(false);
                              client.options.keySprint.setDown(false);
                          } else {
                              restorePhysicalKeyState(client, client.options.keySprint);
                          }
                      }
                  }
              }

              public static void restorePhysicalKeyState(Minecraft client, KeyMapping keyMapping) {
                  InputConstants.Key key = InputConstants.getKey(keyMapping.saveString());
                  if (key.getType() == InputConstants.Type.KEYSYM) {
                      boolean isPhysicallyDown = InputConstants.isKeyDown(client.getWindow().getWindow(), key.getValue());
                      keyMapping.setDown(isPhysicallyDown);
                  }
              }

              private static void renderHud(GuiGraphics guiGraphics) {
                  Minecraft mc = Minecraft.getInstance();
                  LocalPlayer player = mc.player;
                  if (player == null || mc.options.hideGui) return;

                  ModConfig cfg = ModConfig.INSTANCE;
                  if (cfg.showSprintHud) {
                      int x = 8, y = 8, w = 158, h = 44;
                      guiGraphics.fill(x, y, x + w, y + h, 0x90101218);
                      guiGraphics.fill(x, y, x + w, y + 2, cfg.sprintEnabled ? 0xFF00E5FF : 0xFFFF4D4D);

                      String status = cfg.sprintEnabled ? "§bSprintReset §aON" : "§bSprintReset §cOFF";
                      String critTag = cfg.critOnly ? " §e[CRIT]" : " §7[ALL]";
                      String mode = "§7Mode: §f" + cfg.currentMode.name() + " §8(" + cfg.startDelayMs + "/" + cfg.holdDurationMs + "ms)";
                      String extras = "§7AutoSprint: " + (cfg.autoSprint ? "§aON" : "§cOFF") + " §7| ESP: " + (cfg.hitboxEnabled ? "§aON" : "§cOFF");

                      guiGraphics.drawString(mc.font, status + critTag, x + 6, y + 6, 0xFFFFFF, true);
                      guiGraphics.drawString(mc.font, mode, x + 6, y + 19, 0xFFFFFF, true);
                      guiGraphics.drawString(mc.font, extras, x + 6, y + 31, 0xFFFFFF, true);
                  }

                  if (cfg.velocityHudEnabled && !(mc.screen instanceof ModConfigScreen)) {
                      double vy = player.getDeltaMovement().y;
                      String hex = vy > 0.01 ? cfg.upColor : (vy < -0.08 ? cfg.fallColor : cfg.idleColor);
                      int color = ModConfig.parseHexColor(hex, 255);
                      guiGraphics.fill(cfg.velX, cfg.velY, cfg.velX + cfg.velSize, cfg.velY + cfg.velSize, color);
                  }
              }

              private static void renderPlayerHitboxes(WorldRenderContext context) {
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (!cfg.hitboxEnabled) return;

                  Minecraft client = Minecraft.getInstance();
                  if (client.level == null || client.player == null) return;

                  Vec3 cameraPos = context.camera().getPosition();
                  PoseStack poseStack = context.matrixStack();
                  MultiBufferSource consumers = context.consumers();
                  if (poseStack == null || consumers == null) return;

                  int rgb = ModConfig.parseRgb(cfg.hitboxColor);
                  float r = ((rgb >> 16) & 0xFF) / 255.0f;
                  float g = ((rgb >> 8) & 0xFF) / 255.0f;
                  float b = (rgb & 0xFF) / 255.0f;
                  float a = Math.max(10, Math.min(255, cfg.hitboxAlpha)) / 255.0f;
                  float tickDelta = context.tickCounter().getGameTimeDeltaPartialTick(true);

                  RenderSystem.enableBlend();
                  RenderSystem.defaultBlendFunc();
                  RenderSystem.disableCull();

                  for (Player target : client.level.players()) {
                      if (target == client.player) continue;
                      boolean hasArmor = !target.getItemBySlot(EquipmentSlot.HEAD).isEmpty()
                              || !target.getItemBySlot(EquipmentSlot.CHEST).isEmpty()
                              || !target.getItemBySlot(EquipmentSlot.LEGS).isEmpty()
                              || !target.getItemBySlot(EquipmentSlot.FEET).isEmpty();
                      if (target.isInvisible() && !hasArmor) continue;

                      double lerpX = target.xo + (target.getX() - target.xo) * tickDelta;
                      double lerpY = target.yo + (target.getY() - target.yo) * tickDelta;
                      double lerpZ = target.zo + (target.getZ() - target.zo) * tickDelta;

                      AABB box = target.getBoundingBox()
                              .move(lerpX - target.getX(), lerpY - target.getY(), lerpZ - target.getZ())
                              .move(-cameraPos.x, -cameraPos.y, -cameraPos.z);

                      VertexConsumer fillBuffer = consumers.getBuffer(RenderType.debugFilledBox());
                      addTriangleStripBox(fillBuffer, poseStack.last().pose(), box, r, g, b, a);

                      if (cfg.hitboxOutline) {
                          VertexConsumer lineBuffer = consumers.getBuffer(RenderType.lines());
                          ShapeRenderer.renderLineBox(poseStack, lineBuffer, box, r, g, b, 0.95f);
                      }
                  }

                  RenderSystem.enableCull();
                  RenderSystem.disableBlend();
              }

              private static void addTriangleStripBox(VertexConsumer buf, Matrix4f mat, AABB box, float r, float g, float b, float a) {
                  float x1 = (float) box.minX, y1 = (float) box.minY, z1 = (float) box.minZ;
                  float x2 = (float) box.maxX, y2 = (float) box.maxY, z2 = (float) box.maxZ;

                  buf.addVertex(mat, x1, y1, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y1, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y1, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y2, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y2, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y2, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y1, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y1, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y1, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y1, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x1, y2, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y2, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y2, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y1, z1).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y1, z2).setColor(r, g, b, a);
                  buf.addVertex(mat, x2, y1, z2).setColor(r, g, b, a);
              }
          }
          EOF
          cat << 'EOF' > src/client/java/com/example/client/ModConfigScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.AbstractSliderButton;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          import java.util.function.LongConsumer;

          public class ModConfigScreen extends Screen {
              private int activeTab = 0;
              private boolean dragging = false;
              private int dragOffsetX = 0, dragOffsetY = 0;
              private EditBox hitboxColorBox, hitboxAlphaBox, upBox, fallBox, idleBox, sizeBox;

              public ModConfigScreen() {
                  super(Component.literal("Mod Settings"));
              }

              @Override
              protected void init() {
                  this.clearWidgets();
                  ModConfig cfg = ModConfig.INSTANCE;
                  int panelW = 240, panelH = 205;
                  int x = (this.width - panelW) / 2, y = (this.height - panelH) / 2;
                  int btnW = panelW - 24, btnX = x + 12, tabW = (btnW - 4) / 2;

                  this.addRenderableWidget(Button.builder(
                          Component.literal(activeTab == 0 ? "§b§l[ SprintReset ]" : "§7SprintReset"),
                          b -> { activeTab = 0; this.init(); }
                  ).bounds(btnX, y + 24, tabW, 18).build());

                  this.addRenderableWidget(Button.builder(
                          Component.literal(activeTab == 1 ? "§b§l[ ESP & HUD ]" : "§7ESP & HUD"),
                          b -> { activeTab = 1; this.init(); }
                  ).bounds(btnX + tabW + 4, y + 24, tabW, 18).build());

                  if (activeTab == 0) {
                      this.addRenderableWidget(Button.builder(
                              Component.literal("Сброс спринта: " + (cfg.sprintEnabled ? "§aВКЛ" : "§cВЫКЛ")),
                              b -> { cfg.sprintEnabled = !cfg.sprintEnabled; ModConfig.save(); this.init(); }
                      ).bounds(btnX, y + 48, btnW, 20).build());

                      this.addRenderableWidget(Button.builder(
                              Component.literal("Только при крите: " + (cfg.critOnly ? "§aВКЛ" : "§cВЫКЛ")),
                              b -> { cfg.critOnly = !cfg.critOnly; ModConfig.save(); this.init(); }
                      ).bounds(btnX, y + 71, btnW, 20).build());

                      this.addRenderableWidget(Button.builder(
                              Component.literal("Режим: §b" + cfg.currentMode.label),
                              b -> { cfg.currentMode = cfg.currentMode.next(); ModConfig.save(); this.init(); }
                      ).bounds(btnX, y + 94, btnW, 20).build());

                      this.addRenderableWidget(new MsSlider(btnX, y + 117, btnW, 20, "Задержка до сброса", 0, 150, cfg.startDelayMs,
                              val -> { cfg.startDelayMs = val; ModConfig.save(); }));

                      this.addRenderableWidget(new MsSlider(btnX, y + 140, btnW, 20, "Время остановки", 10, 200, cfg.holdDurationMs,
                              val -> { cfg.holdDurationMs = val; ModConfig.save(); }));

                      this.addRenderableWidget(Button.builder(
                              Component.literal("Авто-бег: " + (cfg.autoSprint ? "§aВКЛ" : "§cВЫКЛ") + " §7| HUD: " + (cfg.showSprintHud ? "§aВКЛ" : "§cВЫКЛ")),
                              b -> {
                                  if (!cfg.autoSprint && !cfg.showSprintHud) cfg.autoSprint = true;
                                  else if (cfg.autoSprint && !cfg.showSprintHud) cfg.showSprintHud = true;
                                  else if (cfg.autoSprint) cfg.autoSprint = false;
                                  else cfg.showSprintHud = false;
                                  ModConfig.save();
                                  this.init();
                              }
                      ).bounds(btnX, y + 163, btnW, 20).build());
                  }
                  else {
                      this.addRenderableWidget(Button.builder(
                              Component.literal("ESP Боксы: " + (cfg.hitboxEnabled ? "§aВКЛ" : "§cВЫКЛ") + " §7| Обводка: " + (cfg.hitboxOutline ? "§aВКЛ" : "§cВЫКЛ")),
                              b -> {
                                  if (!cfg.hitboxEnabled) { cfg.hitboxEnabled = true; cfg.hitboxOutline = true; }
                                  else if (cfg.hitboxOutline) cfg.hitboxOutline = false;
                                  else cfg.hitboxEnabled = false;
                                  ModConfig.save();
                                  this.init();
                              }
                      ).bounds(btnX, y + 48, btnW, 20).build());

                      hitboxColorBox = new EditBox(this.font, btnX + 75, y + 72, 65, 18, Component.literal("HEX"));
                      hitboxColorBox.setValue(cfg.hitboxColor);
                      this.addRenderableWidget(hitboxColorBox);

                      hitboxAlphaBox = new EditBox(this.font, btnX + 175, y + 72, 41, 18, Component.literal("Alpha"));
                      hitboxAlphaBox.setValue(String.valueOf(cfg.hitboxAlpha));
                      this.addRenderableWidget(hitboxAlphaBox);

                      this.addRenderableWidget(Button.builder(
                              Component.literal("Квадрат скорости (HUD): " + (cfg.velocityHudEnabled ? "§aВКЛ" : "§cВЫКЛ")),
                              b -> { cfg.velocityHudEnabled = !cfg.velocityHudEnabled; ModConfig.save(); this.init(); }
                      ).bounds(btnX, y + 95, btnW, 20).build());

                      upBox = new EditBox(this.font, btnX + 42, y + 119, 62, 18, Component.literal("Up"));
                      upBox.setValue(cfg.upColor);
                      this.addRenderableWidget(upBox);

                      fallBox = new EditBox(this.font, btnX + 154, y + 119, 62, 18, Component.literal("Fall"));
                      fallBox.setValue(cfg.fallColor);
                      this.addRenderableWidget(fallBox);

                      idleBox = new EditBox(this.font, btnX + 42, y + 141, 62, 18, Component.literal("Idle"));
                      idleBox.setValue(cfg.idleColor);
                      this.addRenderableWidget(idleBox);

                      sizeBox = new EditBox(this.font, btnX + 154, y + 141, 62, 18, Component.literal("Size"));
                      sizeBox.setValue(String.valueOf(cfg.velSize));
                      this.addRenderableWidget(sizeBox);

                      this.addRenderableWidget(Button.builder(Component.literal("§aСохранить цвета и размеры"), b -> {
                          cfg.hitboxColor = hitboxColorBox.getValue();
                          cfg.upColor = upBox.getValue();
                          cfg.fallColor = fallBox.getValue();
                          cfg.idleColor = idleBox.getValue();
                          try { cfg.hitboxAlpha = Math.max(10, Math.min(255, Integer.parseInt(hitboxAlphaBox.getValue().trim()))); } catch (Exception ignored) {}
                          try { cfg.velSize = Math.max(4, Math.min(80, Integer.parseInt(sizeBox.getValue().trim()))); } catch (Exception ignored) {}
                          ModConfig.save();
                      }).bounds(btnX, y + 164, btnW, 20).build());
                  }
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float delta) {
                  this.renderBackground(g, mouseX, mouseY, delta);
                  ModConfig cfg = ModConfig.INSTANCE;
                  int panelW = 240, panelH = 205;
                  int x = (this.width - panelW) / 2, y = (this.height - panelH) / 2;

                  g.fill(x - 1, y - 1, x + panelW + 1, y + panelH + 1, 0xFF00E5FF);
                  g.fill(x, y, x + panelW, y + panelH, 0xE612151E);
                  g.drawCenteredString(this.font, "§b§lSprintReset & ESP §f| Настройки", x + panelW / 2, y + 8, 0xFFFFFF);
                  super.render(g, mouseX, mouseY, delta);

                  if (activeTab == 1) {
                      int btnX = x + 12;
                      g.drawString(this.font, "Цвет HEX:", btnX, y + 77, 0xCCCCCC, false);
                      g.drawString(this.font, "Прозр:", btnX + 143, y + 77, 0xCCCCCC, false);
                      g.drawString(this.font, "Прыж:", btnX, y + 124, 0xFF5555, false);
                      g.drawString(this.font, "Паден:", btnX + 112, y + 124, 0xFF69B4, false);
                      g.drawString(this.font, "Стоит:", btnX, y + 146, 0xFFFF00, false);
                      g.drawString(this.font, "Размер:", btnX + 112, y + 146, 0xAAAAAA, false);
                      if (cfg.velocityHudEnabled) {
                          int preview = ModConfig.parseHexColor(idleBox.getValue(), 255);
                          g.fill(cfg.velX, cfg.velY, cfg.velX + cfg.velSize, cfg.velY + cfg.velSize, preview);
                          g.renderOutline(cfg.velX - 1, cfg.velY - 1, cfg.velSize + 2, cfg.velSize + 2, 0xFFFFFFFF);
                      }
                  }
              }
              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  ModConfig cfg = ModConfig.INSTANCE;
                  if (activeTab == 1 && cfg.velocityHudEnabled && button == 0
                          && mouseX >= cfg.velX && mouseX <= cfg.velX + cfg.velSize
                          && mouseY >= cfg.velY && mouseY <= cfg.velY + cfg.velSize) {
                      dragging = true;
                      dragOffsetX = (int) mouseX - cfg.velX;
                      dragOffsetY = (int) mouseY - cfg.velY;
                      return true;
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              @Override
              public boolean mouseDragged(double mouseX, double mouseY, int button, double dragX, double dragY) {
                  if (dragging) {
                      ModConfig.INSTANCE.velX = (int) mouseX - dragOffsetX;
                      ModConfig.INSTANCE.velY = (int) mouseY - dragOffsetY;
                      return true;
                  }
                  return super.mouseDragged(mouseX, mouseY, button, dragX, dragY);
              }

              @Override
              public boolean mouseReleased(double mouseX, double mouseY, int button) {
                  if (dragging) { dragging = false; ModConfig.save(); }
                  return super.mouseReleased(mouseX, mouseY, button);
              }

              @Override
              public boolean isPauseScreen() { return false; }

              private static class MsSlider extends AbstractSliderButton {
                  private final String prefix;
                  private final long min, max;
                  private final LongConsumer onChange;

                  public MsSlider(int x, int y, int w, int h, String prefix, long min, long max, long cur, LongConsumer onChange) {
                      super(x, y, w, h, Component.empty(), (double) (cur - min) / (max - min));
                      this.prefix = prefix;
                      this.min = min;
                      this.max = max;
                      this.onChange = onChange;
                      this.updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      long val = Math.round(min + (max - min) * this.value);
                      this.setMessage(Component.literal(prefix + ": §e" + val + " мс"));
                  }

                  @Override
                  protected void applyValue() {
                      long val = Math.round(min + (max - min) * this.value);
                      onChange.accept(val);
                  }
              }
          }
