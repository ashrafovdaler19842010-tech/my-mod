name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.NetworkBypassClient/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          # КОНФИГ
          cat << 'EOF' > src/client/java/com/example/client/BypassConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class BypassConfig {
              private static final File FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "network-bypass.json");
              public int mode = 0; 
              public boolean enabled = false;

              public static BypassConfig INSTANCE = new BypassConfig();

              public static void save() {
                  try (FileWriter w = new FileWriter(FILE)) { new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, w); } catch (Exception ignored) {}
              }
              public static void load() {
                  if (FILE.exists()) {
                      try (FileReader r = new FileReader(FILE)) {
                          BypassConfig l = new Gson().fromJson(r, BypassConfig.class);
                          if (l != null) INSTANCE = l;
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          # ЛОГИКА ОБХОДОВ
          cat << 'EOF' > src/client/java/com/example/client/NetworkBypassClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket;
          import net.minecraft.network.protocol.game.ServerboundMoveVehiclePacket;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayDeque;
          import java.util.Queue;

          public class NetworkBypassClient implements ClientModInitializer {
              private static boolean xKeyWasDown = false;
              private static boolean rCtrlWasDown = false;
              
              // Для Blink и Timer
              private static int timerBalance = 0;
              private static int tickCounter = 0;
              private static Queue<Vec3> blinkQueue = new ArrayDeque<>();

              @Override
              public void onInitializeClient() {
                  BypassConfig.load();

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      tickCounter++;

                      // Меню
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof NetworkBypassScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new NetworkBypassScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // X - Вкл/Выкл
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown && client.screen == null) {
                          BypassConfig.INSTANCE.enabled = !BypassConfig.INSTANCE.enabled;
                          client.player.playSound(BypassConfig.INSTANCE.enabled ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
                          BypassConfig.save();
                          
                          // Сброс таймеров при выключении
                          if (!BypassConfig.INSTANCE.enabled) {
                              client.timer.msPerTick = 50.0f;
                              blinkQueue.clear();
                              timerBalance = 0;
                          }
                      }
                      xKeyWasDown = xDown;

                      if (!BypassConfig.INSTANCE.enabled || client.screen != null) return;

                      // Логика методов
                      switch (BypassConfig.INSTANCE.mode) {
                          case 0: // Timer Balance (Grim bypass)
                              // Накапливаем баланс, замедляясь, потом тратим его
                              if (timerBalance < 20) {
                                  client.timer.msPerTick = 60.0f; // Замедление
                                  timerBalance++;
                              } else {
                                  client.timer.msPerTick = 33.3f; // Ускорение
                                  timerBalance--;
                              }
                              break;

                          case 1: // Elytra Desync (Race Condition)
                              if (tickCounter % 5 == 0) {
                                  // Отправляем пакет полета
                                  client.player.connection.send(new ServerboundPlayerCommandPacket(client.player, ServerboundPlayerCommandPacket.Action.START_FALL_FLYING));
                                  // Сразу отправляем пакет "я на земле"
                                  client.player.connection.send(new ServerboundMovePlayerPacket.Pos(client.player.getX(), client.player.getY() - 0.1, client.player.getZ(), true, false));
                              }
                              break;

                          case 2: // Head Hitting (2-block ceiling)
                              if (client.level.getBlockState(client.player.blockPosition().above(2)).isSolid() && client.player.onGround()) {
                                  client.player.jumpFromGround();
                              }
                              break;

                          case 3: // Blink (Ping Spoof)
                              // Сохраняем пакеты 3 тика
                              if (tickCounter % 3 == 0) {
                                  if (blinkQueue.size() < 3) {
                                      blinkQueue.add(client.player.position());
                                      // Останавливаем клиент на месте (визуально)
                                      client.player.setDeltaMovement(0, client.player.getDeltaMovement().y, 0);
                                  } else {
                                      // Выпускаем накопленное (телепорт)
                                      while (!blinkQueue.isEmpty()) {
                                          Vec3 pos = blinkQueue.poll();
                                          client.player.connection.send(new ServerboundMovePlayerPacket.Pos(pos.x, pos.y, pos.z, client.player.onGround(), false));
                                      }
                                  }
                              }
                              break;

                          case 4: // Vehicle Spoof (Boat/Lava)
                              if (client.player.getVehicle() != null && client.player.getVehicle().isControlledByLocalInstance()) {
                                  // Отправляем серверу пакет, что лодка едет быстрее
                                  Vec3 mot = client.player.getVehicle().getDeltaMovement();
                                  client.player.connection.send(new ServerboundMoveVehiclePacket(client.player.getVehicle().position().add(mot.scale(1.5)), client.player.getVehicle().getYRot(), client.player.getVehicle().getXRot(), false));
                              }
                              break;

                          case 5: // Diagonal AABB Strafe
                              if (client.player.onGround() && client.options.keyUp.isDown()) {
                                  // Принудительный прыжок под углом 45 градусов
                                  client.player.setYRot(client.player.getYRot() % 45); 
                                  client.player.jumpFromGround();
                              }
                              break;
                      }
                  });
              }
          }
          EOF

          # МЕНЮ
          cat << 'EOF' > src/client/java/com/example/client/NetworkBypassScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class NetworkBypassScreen extends Screen {
              public NetworkBypassScreen() { super(Component.literal("Network Bypasses")); }

              @Override
              protected void init() {
                  this.clearWidgets();
                  int x = this.width / 2 - 120;
                  int y = this.height / 2 - 80;
                  String[] names = {
                      "Timer Balance (Grim)",
                      "Elytra Desync",
                      "Head Hitting",
                      "Blink (Ping Spoof)",
                      "Vehicle Spoof",
                      "Diagonal Strafe"
                  };

                  for (int i = 0; i < 6; i++) {
                      final int mode = i;
                      String btnText = (BypassConfig.INSTANCE.mode == i ? "§a" : "§7") + names[i];
                      this.addRenderableWidget(Button.builder(Component.literal(btnText), b -> {
                          BypassConfig.INSTANCE.mode = mode;
                          BypassConfig.save();
                          this.init();
                      }).bounds(x, y + (i * 25), 240, 20).build());
                  }
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  context.drawCenteredString(this.font, "§l§bNetwork Desync Bypasses", this.width / 2, this.height / 2 - 100, 0xFFFFFF);
                  context.drawCenteredString(this.font, "§7Status: " + (BypassConfig.INSTANCE.enabled ? "§aENABLED" : "§cDISABLED"), this.width / 2, this.height / 2 - 85, 0xFFFFFF);
                  super.render(context, mouseX, mouseY, delta);
              }

              @Override public boolean isPauseScreen() { return false; }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
