name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: unzip -o mod.zip || true
      
      - name: Configure Project
        run: |
          sed -i 's/^fabric_loader_version=.*/fabric_loader_version=0.16.9/' gradle.properties
          sed -i 's/^minecraft_version=.*/minecraft_version=1.21.8/' gradle.properties

          rm -rf src

          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "custommod",
            "version": "1.0.0",
            "name": "Custom Mod",
            "description": "Mod built from custom sources",
            "authors": ["You"],
            "contact": {},
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.example.client.MainClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.8",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          mkdir -p src/client/java/com/example/client

          # --- ГЕНЕРАЦИЯ MainClient.java ---
          cat << 'EOF' > src/client/java/com/example/client/MainClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class MainClient implements ClientModInitializer {
              public static boolean killAuraEnabled = false;
              public static boolean autoSprint = true;
              public static boolean moveCorrection = true;
              public static double range = 3.0;
              public static float fov = 180.0f; // Ограничение угла обзора
              public static int sprintResetDelay = 1; // Задержка сброса спринта (в тиках)

              private static boolean xKeyWasDown = false;
              private static boolean rCtrlWasDown = false;

              // Переменные ротации
              private static float lastYaw = 0;
              private static float lastPitch = 0;
              private static float currentYaw = 0;
              private static float currentPitch = 0;
              
              // Стейт-машина для спринт-ресета
              private static int sprintResetState = 0; // 0 - ждем, 1 - сбросили, 2 - бьем
              private static int sprintTimer = 0;
              private static int attackCooldown = 0;

              @Override
              public void onInitializeClient() {
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null || client.level == null) return;
                      long win = client.getWindow().getWindow();

                      // Меню
                      boolean rCtrl = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL);
                      if (rCtrl && !rCtrlWasDown) {
                          if (client.screen instanceof GuiScreen) client.setScreen(null);
                          else if (client.screen == null) client.setScreen(new GuiScreen());
                      }
                      rCtrlWasDown = rCtrl;

                      // Вкл/Выкл
                      boolean xDown = InputConstants.isKeyDown(win, GLFW.GLFW_KEY_X);
                      if (xDown && !xKeyWasDown && client.screen == null) {
                          killAuraEnabled = !killAuraEnabled;
                          playSound(killAuraEnabled);
                          if (!killAuraEnabled) {
                              currentYaw = client.player.getYRot();
                              currentPitch = client.player.getXRot();
                          }
                      }
                      xKeyWasDown = xDown;

                      // АВТО-СПРИНТ (Если зажат W и L-Ctrl)
                      if (autoSprint && client.options.keyUp.isDown() && client.options.keyLeftControl.isDown()) {
                          client.player.setSprinting(true);
                      }

                      if (!killAuraEnabled) return;

                      // Поиск цели
                      double closestDist = range;
                      Entity target = null;
                      Vec3 eyePos = client.player.getEyePosition();

                      for (Entity entity : client.level.getEntities(client.player, client.player.getBoundingBox().inflate(range))) {
                          if (entity instanceof LivingEntity living && living != client.player && living.isAlive()) {
                              // Проверка на видимость (сквозь стены не бьем)
                              if (!client.player.hasLineOfSight(living)) continue;

                              double dist = client.player.distanceTo(living);
                              if (dist <= closestDist) {
                                  closestDist = dist;
                                  target = living;
                              }
                          }
                      }

                      if (target != null) {
                          // 1. Ближайшая точка на хитбоксе
                          AABB box = target.getBoundingBox();
                          double targetX = Mth.clamp(eyePos.x, box.minX, box.maxX);
                          double targetY = Mth.clamp(eyePos.y + (target.getBbHeight() * 0.5), box.minY, box.maxY);
                          double targetZ = Mth.clamp(eyePos.z, box.minZ, box.maxZ);

                          // 2. Вычисление углов
                          double dx = targetX - eyePos.x;
                          double dy = targetY - eyePos.y;
                          double dz = targetZ - eyePos.z;
                          double dist2D = Math.sqrt(dx * dx + dz * dz);

                          float targetYaw = (float) (Math.toDegrees(Math.atan2(dz, dx)) - 90.0F);
                          float targetPitch = (float) (-Math.toDegrees(Math.atan2(dy, dist2D)));

                          // 3. Проверка FOV (Смотрим ли мы на цель)
                          float yawDiff = Math.abs(Mth.wrapDegrees(targetYaw - client.player.getYRot()));
                          if (yawDiff > fov / 2.0f) return; // Не смотрим - не бьем

                          // 4. ПЛАВНАЯ РОТАЦИЯ (Античит-байпас)
                          float deltaYaw = Mth.wrapDegrees(targetYaw - currentYaw);
                          float deltaPitch = targetPitch - currentPitch;

                          // Ограничиваем скорость поворота (30 градусов за тик макс)
                          float maxStep = 30.0f;
                          float yawStep = Mth.clamp(deltaYaw, -maxStep, maxStep);
                          float pitchStep = Mth.clamp(deltaPitch, -maxStep, maxStep);

                          // GCD (Шаги мыши, как у реального игрока)
                          float gcd = getGCD();
                          yawStep -= yawStep % gcd;
                          pitchStep -= pitchStep % gcd;

                          currentYaw += yawStep;
                          currentPitch += pitchStep;

                          // Применяем поворот
                          client.player.setYRot(currentYaw);
                          client.player.setXRot(currentPitch);

                          // 5. ЛОГИКА СПРИНТ-РЕСЕТА И УДАРА
                          if (attackCooldown > 0) {
                              attackCooldown--;
                          } else {
                              if (sprintResetState == 0) {
                                  // Начинаем сброс спринта
                                  client.player.setSprinting(false);
                                  sprintResetState = 1;
                                  sprintTimer = sprintResetDelay;
                              } else if (sprintResetState == 1) {
                                  if (sprintTimer > 0) {
                                      sprintTimer--;
                                  } else {
                                      // Бьем!
                                      if (client.player.getAttackStrengthScale(0.5F) >= 1.0F && (!client.player.onGround() && client.player.fallDistance > 0.0F)) {
                                          client.gameMode.attack(client.player, target);
                                          client.player.swing(InteractionHand.MAIN_HAND);
                                          client.player.resetAttackStrengthTicker(); // Быстрый крит
                                          attackCooldown = 2; // Кулдаун между ударами
                                      }
                                      sprintResetState = 2;
                                  }
                              } else if (sprintResetState == 2) {
                                  // Возвращаем спринт
                                  if (autoSprint && client.options.keyUp.isDown()) {
                                      client.player.setSprinting(true);
                                  }
                                  sprintResetState = 0;
                              }
                          }
                      } else {
                          sprintResetState = 0; // Сброс, если нет цели
                          if (autoSprint && client.options.keyUp.isDown() && client.options.keyLeftControl.isDown()) {
                              client.player.setSprinting(true);
                          }
                      }
                  });

                  // Рендер ХП (Оставляем как было)
                  WorldRenderEvents.AFTER_ENTITIES.register(context -> {
                      if (!killAuraEnabled) return;
                      var matrices = context.matrixStack();
                      if (matrices == null) return;
                      
                      for (Entity entity : context.world().entitiesForRendering()) {
                          if (entity instanceof LivingEntity living && living != Minecraft.getInstance().player && living.isAlive()) {
                              double dist = Minecraft.getInstance().player.distanceTo(living);
                              if (dist <= range + 10) {
                                  Vec3 pos = living.position().add(0, living.getBbHeight() + 0.4, 0);
                                  matrices.pushPose();
                                  matrices.translate(pos.x - context.camera().getPosition().x, pos.y - context.camera().getPosition().y, pos.z - context.camera().getPosition().z);
                                  matrices.mulPose(Minecraft.getInstance().getEntityRenderDispatcher().cameraOrientation());
                                  matrices.scale(-0.025F, -0.025F, 0.025F);
                                  
                                  float realHp = getRealHealth(living);
                                  net.minecraft.network.chat.Component textComp = net.minecraft.network.chat.Component.literal(String.format("§c%.1f ❤", realHp));
                                  
                                  Minecraft.getInstance().font.drawInBatch(
                                      textComp, 
                                      -Minecraft.getInstance().font.width(textComp) / 2.0f, 
                                      0, 
                                      0xFFFFFF, 
                                      false, 
                                      matrices.last().pose(), 
                                      context.consumers(), 
                                      net.minecraft.client.gui.Font.DisplayMode.SEE_THROUGH, 
                                      0, 
                                      0xFFFFFFFF
                                  );
                                  matrices.popPose();
                              }
                          }
                      }
                  });
              }

              private static float getRealHealth(LivingEntity living) {
                  var scoreboard = living.level().getScoreboard();
                  var objective = scoreboard.getObjective("health");
                  if (objective != null) {
                      var score = scoreboard.getOrCreatePlayerScore(living, objective);
                      if (score != null) {
                          return score.get(); 
                      }
                  }
                  return living.getHealth();
              }

              private float getGCD() {
                  double sensitivity = Minecraft.getInstance().options.sensitivity().get();
                  double f = sensitivity * 0.6 + 0.2;
                  double gcd = f * f * f * 8.0 * 0.15;
                  return (float) gcd;
              }

              private void playSound(boolean enabled) {
                  Minecraft.getInstance().getSoundManager().play(
                      net.minecraft.client.resources.sounds.SimpleSoundInstance.forUI(
                          enabled ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f
                      )
                  );
              }
          }
          EOF

          # --- ГЕНЕРАЦИЯ GuiScreen.java ---
          cat << 'EOF' > src/client/java/com/example/client/GuiScreen.java
          package com.example.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          public class GuiScreen extends Screen {
              public GuiScreen() { super(Component.literal("KillAura Settings")); }

              @Override
              protected void init() {
                  int x = width / 2 - 100;
                  int y = height / 2 - 70;

                  this.addRenderableWidget(Button.builder(Component.literal("KillAura: " + (MainClient.killAuraEnabled ? "§aON" : "§cOFF")), b -> {
                      MainClient.killAuraEnabled = !MainClient.killAuraEnabled;
                      b.setMessage(Component.literal("KillAura: " + (MainClient.killAuraEnabled ? "§aON" : "§cOFF")));
                  }).bounds(x, y, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("Auto Sprint: " + (MainClient.autoSprint ? "§aON" : "§cOFF")), b -> {
                      MainClient.autoSprint = !MainClient.autoSprint;
                      b.setMessage(Component.literal("Auto Sprint: " + (MainClient.autoSprint ? "§aON" : "§cOFF")));
                  }).bounds(x, y + 25, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("Sprint Reset Delay: " + MainClient.sprintResetDelay + " ticks"), b -> {
                      MainClient.sprintResetDelay = (MainClient.sprintResetDelay + 1) % 4;
                      b.setMessage(Component.literal("Sprint Reset Delay: " + MainClient.sprintResetDelay + " ticks"));
                  }).bounds(x, y + 50, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("Range: " + MainClient.range), b -> {
                      MainClient.range += 0.5;
                      if (MainClient.range > 6.0) MainClient.range = 3.0;
                      b.setMessage(Component.literal("Range: " + MainClient.range));
                  }).bounds(x, y + 75, 200, 20).build());

                  this.addRenderableWidget(Button.builder(Component.literal("FOV: " + MainClient.fov + "°"), b -> {
                      MainClient.fov += 30;
                      if (MainClient.fov > 360) MainClient.fov = 60;
                      b.setMessage(Component.literal("FOV: " + MainClient.fov + "°"));
                  }).bounds(x, y + 100, 200, 20).build());
              }

              @Override
              public void render(GuiGraphics context, int mouseX, int mouseY, float delta) {
                  this.renderBackground(context, mouseX, mouseY, delta);
                  context.drawCenteredString(this.font, "§l§bKillAura Settings", this.width / 2, this.height / 2 - 90, 0xFFFFFF);
                  super.render(context, mouseX, mouseY, delta);
              }
              
              @Override
              public boolean isPauseScreen() { return false; }
          }
          EOF

          if ! grep -q "duplicatesStrategy" build.gradle; then
            echo "" >> build.gradle
            echo "tasks.named('jar') {" >> build.gradle
            echo "    duplicatesStrategy = DuplicatesStrategy.EXCLUDE" >> build.gradle
            echo "}" >> build.gradle
            echo "tasks.named('sourcesJar') {" >> build.gradle
            echo "    duplicatesStrategy = DuplicatesStrategy.EXCLUDE" >> build.gradle
            echo "}" >> build.gradle
          fi

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - run: chmod +x gradlew && ./gradlew clean build
      
      - uses: actions/upload-artifact@v4
        with:
          name: custom-mod
          path: | 
            build/libs/*.jar
            !build/libs/*-sources.jar
