name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.CombatUtilsClient/g' src/main/resources/fabric.mod.json
          
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/template-mod.accesswidener
          accessWidener v2 named
          accessible field net/minecraft/world/entity/LivingEntity noJumpDelay I
          EOF
          
          sed -i 's/"entrypoints": {/"accessWidener": "template-mod.accesswidener",\n  "entrypoints": {/g' src/main/resources/fabric.mod.json

          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client
          
          cat << 'EOF' > src/client/java/com/example/client/ModConfig.java
          package com.example.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class ModConfig {
              private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "combat-utils.json");

              public boolean sprintEnabled = true;
              public boolean autoSprint = true;
              public String sprintMode = "W_TAP";
              public long startDelayMs = 15;
              public long holdDurationMs = 55;
              public boolean noJumpDelay = true;

              // 10 SPEED MODES
              public boolean speedEnabled = false;
              public int speedKey = 71; // G
              public int speedMode = 1; // 1-10
              public float speedValue = 1.5f;

              public boolean triggerbotEnabled = false;
              public int triggerbotKey = 67; // C
              public float triggerMaxDist = 3.0f;
              public int triggerDelay = 0;
              public boolean smartTrigger = true;

              public boolean aimAssistEnabled = false;
              public int aimKey = 86; // V
              public float aimFov = 90.0f;
              public int aimMode = 1; 
              public int aimSpeed = 40;
              public int aimSmoothness = 30;
              public boolean aimWallCheck = true;
              public boolean aimSilent = true;
              public boolean hitboxAim = true;
              public boolean randomAimPoint = true;

              // 10 KILLAURA MODES
              public boolean killauraEnabled = false;
              public int killauraKey = 82; // R
              public int killauraMode = 1; // 1-10
              public boolean swordOnly = true;
              public boolean killauraCritOnly = true;
              public float killauraRange = 6.0f; // До 6 блоков
              public int killauraDelay = 50;
              public int backtrackDelay = 3; // Задержка для Backtrack (тики)

              public static ModConfig INSTANCE = new ModConfig();

              public static void save() {
                  try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                      new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, writer);
                  } catch (Exception ignored) {}
              }

              public static void load() {
                  if (CONFIG_FILE.exists()) {
                      try (FileReader reader = new FileReader(CONFIG_FILE)) {
                          ModConfig loaded = new Gson().fromJson(reader, ModConfig.class);
                          if (loaded != null) INSTANCE = loaded;
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > src/client/java/com/example/client/CombatUtilsClient.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.network.protocol.game.ServerboundPlayerCommandPacket;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;
          import java.util.*;

          public class CombatUtilsClient implements ClientModInitializer {

              private static boolean rCtrlWasDown = false;
              private static boolean resetting = false;
              private static long resetStart = 0, resetEnd = 0;

              private static boolean trigToggled = false, aimToggled = false, kaToggled = false, spdToggled = false;
              private static boolean canTrigger = true;
              private static long lastTriggerTime = 0;

              private static boolean tKey, aKey, kKey, sKey;

              private static final Map<Entity, Deque<Vec3>> positionHistory = new HashMap<>();
              private static int tickCounter = 0;

              @Override
              public void onInitializeClient() {
                  ModConfig.load();

                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hitResult) -> {
                      ModConfig cfg = ModConfig.INSTANCE;
                      if (cfg.sprintEnabled && world.isClientSide && player == Minecraft.getInstance().player) {
                          if (player.isSprinting() || cfg.autoSprint) {
                              resetStart = System.currentTimeMillis() + cfg.startDelayMs;
                              resetEnd = resetStart + cfg.holdDurationMs;
                              resetting = true;
                          }
                      }
                      return InteractionResult.PASS;
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      ModConfig cfg = ModConfig.INSTANCE;
                      tickCounter++;

                      if (InputConstants.isKeyDown(win, GLFW.GLFW_KEY_RIGHT_CONTROL)) {
                          if (!rCtrlWasDown) {
                              if (client.screen instanceof ModConfigScreen) client.setScreen(null);
                              else if (client.screen == null) client.setScreen(new ModConfigScreen());
                          }
                          rCtrlWasDown = true;
                      } else rCtrlWasDown = false;

                      if (cfg.noJumpDelay && client.options.keyJump.isDown()) client.player.noJumpDelay = 0;

                      if (client.screen == null) {
                          if (cfg.triggerbotEnabled) { boolean d = InputConstants.isKeyDown(win, cfg.triggerbotKey); if (d && !tKey) trigToggled = !trigToggled; tKey = d; }
                          if (cfg.aimAssistEnabled) { boolean d = InputConstants.isKeyDown(win, cfg.aimKey); if (d && !aKey) aimToggled = !aimToggled; aKey = d; }
                          if (cfg.killauraEnabled) { boolean d = InputConstants.isKeyDown(win, cfg.killauraKey); if (d && !kKey) kaToggled = !kaToggled; kKey = d; }
                          if (cfg.speedEnabled) { boolean d = InputConstants.isKeyDown(win, cfg.speedKey); if (d && !sKey) spdToggled = !spdToggled; sKey = d; }
                      } else { tKey = aKey = kKey = sKey = true; }

                      // --- 10 SPEED MODES ---
                      if (cfg.speedEnabled && spdToggled && client.screen == null) {
                          if (cfg.speedMode >= 1 && cfg.speedMode <= 10) {
                              switch (cfg.speedMode) {
                                  case 1: client.timer.msPerTick = 50.0f / cfg.speedValue; break; // Timer
                                  case 2: if (client.player.onGround() && client.options.keyUp.isDown()) client.player.jumpFromGround(); break; // LowHop
                                  case 3: if (!client.player.onGround() && client.options.keyUp.isDown()) { Vec3 m = client.player.getDeltaMovement(); client.player.setDeltaMovement(m.x * cfg.speedValue, m.y, m.z * cfg.speedValue); } break; // Strafe
                                  case 4: if (client.player.getDeltaMovement().y < 0) client.player.setDeltaMovement(client.player.getDeltaMovement().x, -cfg.speedValue, client.player.getDeltaMovement().z); break; // FastFall
                                  case 5: if (!client.player.isFallFlying()) client.player.connection.send(new ServerboundPlayerCommandPacket(client.player, ServerboundPlayerCommandPacket.Action.START_FALL_FLYING)); break; // Elytra Spoof
                                  case 6: if (client.player.onGround() && client.options.keyUp.isDown()) { Vec3 m = client.player.getDeltaMovement(); client.player.setDeltaMovement(m.x * 1.2, m.y, m.z * 1.2); } break; // Ground
                                  case 7: if (client.player.isUsingItem()) client.player.setDeltaMovement(client.player.getDeltaMovement().multiply(1.3, 1, 1.3)); break; // NoSlow
                                  case 8: if (client.player.onGround() && client.options.keyUp.isDown()) client.player.jumpFromGround(); break; // Bunny
                                  case 9: if (client.player.horizontalCollision) client.player.setDeltaMovement(client.player.getDeltaMovement().x, 0.5, client.player.getDeltaMovement().z); break; // Step
                                  case 10: if (tickCounter % 2 == 0) client.player.connection.send(new ServerboundMovePlayerPacket.Pos(client.player.getX() + cfg.speedValue, client.player.getY(), client.player.getZ(), client.player.onGround(), false)); break; // PacketFlood
                              }
                          }
                      } else if (client.timer.msPerTick != 50.0f) client.timer.msPerTick = 50.0f;

                      // --- BACKTRACK TRACKER ---
                      if (client.level != null) {
                          for (Entity e : client.level.entitiesForRendering()) {
                              if (e == client.player) continue;
                              positionHistory.putIfAbsent(e, new ArrayDeque<>());
                              Deque<Vec3> h = positionHistory.get(e);
                              h.addLast(e.position());
                              if (h.size() > cfg.backtrackDelay + 1) h.removeFirst();
                          }
                      }

                      // --- AIM ASSIST ---
                      if (cfg.aimAssistEnabled && aimToggled && client.screen == null) {
                          Entity target = getBestTarget(client, cfg.aimFov, cfg.aimWallCheck);
                          if (target instanceof LivingEntity living) {
                              Vec3 pos = cfg.randomAimPoint ? new Vec3(living.getBoundingBox().minX + Math.random() * living.getBoundingBox().getXsize(), living.getBoundingBox().minY + Math.random() * living.getBoundingBox().getYsize(), living.getBoundingBox().minZ + Math.random() * living.getBoundingBox().getZsize()) : living.getEyePosition();
                              applyRotation(client, pos, cfg, cfg.aimMode, cfg.aimSpeed, cfg.aimSilent, cfg.aimSmoothness);
                          }
                      }

                      // --- 10 KILLAURA MODES ---
                      if (cfg.killauraEnabled && kaToggled && client.screen == null) {
                          if (System.currentTimeMillis() - lastTriggerTime >= cfg.killauraDelay) {
                              ItemStack held = client.player.getMainHandItem();
                              if (!cfg.swordOnly || held.is(ItemTags.SWORDS)) {
                                  boolean canHit = !cfg.killauraCritOnly || (client.player.fallDistance > 0.0F && !client.player.onGround() && !client.player.isInWater());
                                  if (canHit) {
                                      Entity target = getClosestEntity(client, cfg.killauraRange);
                                      if (target != null) {
                                          Vec3 hitVec = target.position();
                                          boolean silentRot = false;
                                          boolean throughWalls = false;

                                          switch (cfg.killauraMode) {
                                              case 1: silentRot = false; throughWalls = false; break; // Normal
                                              case 2: silentRot = true; throughWalls = false; break; // Silent
                                              case 3: silentRot = true; throughWalls = true; break; // Through Wall (Silent)
                                              case 4: Deque<Vec3> h = positionHistory.get(target); if (h != null && !h.isEmpty()) hitVec = h.peekFirst(); silentRot = true; break; // Backtrack
                                              case 5: cfg.killauraRange = 6.0f; silentRot = false; break; // Reach (6 blocks)
                                              case 6: silentRot = false; throughWalls = true; break; // Through Wall (Normal)
                                              case 7: silentRot = true; hitVec = target.getBoundingBox().getCenter(); break; // Polar Bypass (Center)
                                              case 8: silentRot = true; hitVec = target.getBoundingBox().getCenter(); hitVec = hitVec.add((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3); break; // Shard Bypass (Random)
                                              case 9: if (tickCounter % 2 != 0) return; silentRot = true; throughWalls = true; break; // TickSync
                                              case 10: silentRot = true; throughWalls = true; cfg.killauraRange = 6.0f; break; // GodMode
                                          }

                                          if (throughWalls || client.player.hasLineOfSight(target)) {
                                              applyRotation(client, hitVec, cfg, cfg.killauraMode == 1 ? 0 : 1, 100, silentRot, 0);
                                              if (client.gameMode != null && target.isAlive()) {
                                                  client.gameMode.attack(client.player, target);
                                                  client.player.swing(InteractionHand.MAIN_HAND);
                                              }
                                              lastTriggerTime = System.currentTimeMillis();
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      // --- TRIGGERBOT ---
                      if (cfg.triggerbotEnabled && trigToggled && client.screen == null) {
                          if (client.player.onGround()) canTrigger = true;
                          boolean falling = !client.player.onGround() && client.player.getDeltaMovement().y < 0 && client.player.fallDistance > 0;
                          Entity target = client.crosshairPickEntity;
                          boolean safe = !cfg.smartTrigger || client.player.hurtTime == 0;
                          if (canTrigger && falling && target != null && safe && client.player.distanceTo(target) <= cfg.triggerMaxDist) {
                              if (System.currentTimeMillis() - lastTriggerTime >= cfg.triggerDelay) {
                                  if (client.gameMode != null) { client.gameMode.attack(client.player, target); client.player.swing(InteractionHand.MAIN_HAND); }
                                  canTrigger = false; lastTriggerTime = System.currentTimeMillis();
                              }
                          }
                      }

                      // --- SPRINT ---
                      long now = System.currentTimeMillis();
                      boolean activeReset = false;
                      if (cfg.sprintEnabled && resetting) {
                          if (now >= resetStart && now <= resetEnd) {
                              activeReset = true;
                              if (cfg.sprintMode.equals("W_TAP")) client.options.keyUp.setDown(false);
                              else if (cfg.sprintMode.equals("S_TAP")) { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                          } else if (now > resetEnd) { restoreKeys(client); resetting = false; }
                      }
                      if (cfg.autoSprint && client.screen == null && !activeReset) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) client.options.keySprint.setDown(true); else restoreKeys(client);
                      }
                  });
              }

              private static void applyRotation(Minecraft mc, Vec3 target, ModConfig cfg, int mode, int speed, boolean silent, int smoothness) {
                  LocalPlayer p = mc.player;
                  float[] r = getRotations(p.getEyePosition(), target);
                  float dY = Mth.wrapDegrees(r[0] - p.getYRot()), dP = r[1] - p.getXRot();
                  float step = (speed / 100f) * (1f - (smoothness / 100f * 0.8f)) * 10f;
                  float nY = p.getYRot(), nP = p.getXRot();
                  if (mode == 0) { nY = r[0]; nP = r[1]; }
                  else if (mode == 1) { nY += Mth.clamp(dY, -step, step); nP += Mth.clamp(dP, -step, step); }
                  nY += (Math.random() - 0.5) * 0.2; nP += (Math.random() - 0.5) * 0.2; nP = Mth.clamp(nP, -90f, 90f);
                  if (silent) p.connection.send(new ServerboundMovePlayerPacket.Rot(nY, nP, p.onGround(), false));
                  else { p.setYRot(nY); p.setXRot(nP); }
              }

              private static Entity getBestTarget(Minecraft mc, float fov, boolean wall) {
                  Entity best = null; double bd = 6.0;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive() || (wall && !mc.player.hasLineOfSight(e))) continue;
                      double d = mc.player.distanceTo(e);
                      if (d <= bd && Math.toDegrees(Math.acos(mc.player.getLookAngle().dot(e.getEyePosition().subtract(mc.player.getEyePosition()).normalize()))) <= fov/2) { bd = d; best = e; }
                  }
                  return best;
              }

              private static Entity getClosestEntity(Minecraft mc, float range) {
                  Entity best = null; double bd = range;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !e.isAlive()) continue;
                      double d = mc.player.distanceTo(e); if (d <= bd) { bd = d; best = e; }
                  }
                  return best;
              }

              private static float[] getRotations(Vec3 f, Vec3 t) {
                  double dx = t.x - f.x, dy = t.y - f.y, dz = t.z - f.z;
                  return new float[]{(float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F, (float)(-(Math.atan2(dy, Math.sqrt(dx*dx + dz*dz)) * 180.0 / Math.PI))};
              }

              private static void restoreKeys(Minecraft c) {
                  long w = c.getWindow().getWindow();
                  c.options.keyUp.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyUp.saveString()).getValue()));
                  c.options.keyDown.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyDown.saveString()).getValue()));
                  c.options.keySprint.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keySprint.saveString()).getValue()));
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
