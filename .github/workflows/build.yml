name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o mod.zip || true
      - name: Build Mod Sources
        run: |
          sed -i 's/"fabricloader": "[^"]*"/"fabricloader": ">=0.16.0"/g' src/main/resources/fabric.mod.json
          sed -i 's/com.example.client.TemplateModClient/com.example.client.RenderWorker/g' src/main/resources/fabric.mod.json
          
          cat << 'EOF' > src/main/resources/template-mod.accesswidener
          accessWidener v2 named
          accessible field net/minecraft/world/entity/LivingEntity noJumpDelay I
          EOF
          
          if ! grep -q "accessWidener" src/main/resources/fabric.mod.json; then
            sed -i 's/"entrypoints": {/"accessWidener": "template-mod.accesswidener",\n  "entrypoints": {/g' src/main/resources/fabric.mod.json
          fi
          
          if ! grep -q "accessWidenerPath" build.gradle; then
            echo "loom { accessWidenerPath = file(\"src/main/resources/template-mod.accesswidener\") }" >> build.gradle
          fi

          cat << 'EOF' > src/client/resources/template-mod.client.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "EntityMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          echo "tasks.withType(JavaCompile).configureEach { options.release = 21 }" >> build.gradle

          rm -rf src/client/java/com/example/client/*
          mkdir -p src/client/java/com/example/client/mixin
          
          # КОНФИГ
          cat << 'EOF' > src/client/java/com/example/client/RenderSettings.java
          package com.example.client;
          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;

          public class RenderSettings {
              private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "nvidia-profile.json");
              public boolean vSync = true; 
              public int sprintKey = 74; // J
              public String frameLimit = "W_TAP";
              public long startDelay = 20, holdDuration = 40;
              public boolean renderDistance = false; 
              public int distanceKey = 67; // C
              public float maxDistance = 3.0f;
              public boolean silentDistance = true, distanceCritOnly = true, distanceSwordOnly = true;
              public boolean healthBypass = true;
              public static RenderSettings INSTANCE = new RenderSettings();
              public static void save() { try (FileWriter w = new FileWriter(CONFIG_FILE)) { new GsonBuilder().setPrettyPrinting().create().toJson(INSTANCE, w); } catch (Exception ignored) {} }
              public static void load() {
                  if (CONFIG_FILE.exists()) { try (FileReader r = new FileReader(CONFIG_FILE)) { RenderSettings l = new Gson().fromJson(r, RenderSettings.class); if (l != null) INSTANCE = l; } catch (Exception ignored) {} }
              }
          }
          EOF

          # MIXIN (Health Bypass)
          cat << 'EOF' > src/client/java/com/example/client/mixin/EntityMixin.java
          package com.example.client.mixin;
          import com.example.client.RenderSettings;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.player.Player;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(Entity.class)
          public class EntityMixin {
              @Inject(method = "isInvisible", at = @At("HEAD"), cancellable = true)
              public void onIsInvisible(CallbackInfoReturnable<Boolean> cir) {
                  if (RenderSettings.INSTANCE.healthBypass && (Object)this instanceof Player) cir.setReturnValue(false);
              }
          }
          EOF

          # ЯДРО
          cat << 'EOF' > src/client/java/com/example/client/RenderWorker.java
          package com.example.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.client.Minecraft;
          import net.minecraft.network.protocol.game.ServerboundMovePlayerPacket;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.ItemTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          public class RenderWorker implements ClientModInitializer {
              private static boolean sprintToggled = true, killToggled = false, killKeyWasDown = false, sprintKeyWasDown = false;
              private static boolean resetting = false;
              private static long resetStart = 0, resetEnd = 0, lastAttackTime = 0;
              private static Entity pendingTarget = null;
              private static LivingEntity lockedTarget = null;

              @Override
              public void onInitializeClient() {
                  RenderSettings.load();

                  AttackEntityCallback.EVENT.register((player, world, hand, entity, hitResult) -> {
                      RenderSettings cfg = RenderSettings.INSTANCE;
                      if (!cfg.vSync || !world.isClientSide || player != Minecraft.getInstance().player) return InteractionResult.PASS;
                      boolean isCrit = player.fallDistance > 0.0F && !player.onGround();
                      if (isCrit && !resetting && pendingTarget == null) {
                          resetStart = System.currentTimeMillis() + cfg.startDelay;
                          resetEnd = resetStart + cfg.holdDuration;
                          resetting = true; pendingTarget = entity;
                          return InteractionResult.FAIL;
                      }
                      return InteractionResult.PASS;
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;
                      long win = client.getWindow().getWindow();
                      RenderSettings cfg = RenderSettings.INSTANCE;

                      // Бинды J и C
                      boolean jDown = InputConstants.isKeyDown(win, cfg.sprintKey);
                      if (jDown && !sprintKeyWasDown) { sprintToggled = !sprintToggled; playSound(client, sprintToggled); }
                      sprintKeyWasDown = jDown;
                      boolean cDown = InputConstants.isKeyDown(win, cfg.distanceKey);
                      if (cDown && !killKeyWasDown) { killToggled = !killToggled; playSound(client, killToggled); if (killToggled) lockedTarget = null; }
                      killKeyWasDown = cDown;

                      // Спринт (ДО удара)
                      if (resetting && pendingTarget != null) {
                          long now = System.currentTimeMillis();
                          if (now >= resetStart && now <= resetEnd) {
                              if (cfg.frameLimit.equals("W_TAP")) client.options.keyUp.setDown(false);
                              else { client.options.keyUp.setDown(false); client.options.keyDown.setDown(true); }
                          } else if (now > resetEnd) {
                              restoreKeys(client);
                              if (client.gameMode != null && pendingTarget.isAlive()) {
                                  client.gameMode.attack(client.player, pendingTarget);
                                  client.player.swing(InteractionHand.MAIN_HAND);
                              }
                              pendingTarget = null; resetting = false;
                          }
                      }

                      // Киллка (360, Freelook, Crits)
                      if (killToggled && client.screen == null) {
                          if (lockedTarget == null || !lockedTarget.isAlive() || client.player.distanceTo(lockedTarget) > cfg.maxDistance) lockedTarget = getClosestEntity360(client, cfg.maxDistance);
                          if (lockedTarget != null) {
                              ItemStack held = client.player.getMainHandItem();
                              boolean swordCheck = !cfg.distanceSwordOnly || held.is(ItemTags.SWORDS);
                              boolean critCheck = !cfg.distanceCritOnly || (client.player.fallDistance > 0.0F && !client.player.onGround());
                              if (swordCheck && critCheck && client.player.getAttackStrengthScale(0.5f) >= 1.0f && (System.currentTimeMillis() - lastAttackTime > 500)) {
                                  float oldYaw = client.player.getYRot(), oldPitch = client.player.getXRot();
                                  float[] rots = getRotations(client.player, lockedTarget);
                                  
                                  // Отправляем пакет (Freelook)
                                  client.player.connection.send(new ServerboundMovePlayerPacket.Rot(rots[0], rots[1], client.player.onGround(), false));
                                  
                                  if (client.gameMode != null) {
                                      client.gameMode.attack(client.player, lockedTarget);
                                      client.player.swing(InteractionHand.MAIN_HAND);
                                      client.player.resetAttackStrengthTicker();
                                  }
                                  // Возвращаем угол
                                  if (cfg.silentDistance) client.player.connection.send(new ServerboundMovePlayerPacket.Rot(oldYaw, oldPitch, client.player.onGround(), false));
                                  lastAttackTime = System.currentTimeMillis();
                              }
                          }
                      }

                      // Авто-спринт
                      if (sprintToggled && !resetting && pendingTarget == null && client.screen == null) {
                          if (client.options.keyUp.isDown() && !client.player.isShiftKeyDown()) client.options.keySprint.setDown(true);
                          else restoreKeys(client);
                      }
                  });
              }

              private static LivingEntity getClosestEntity360(Minecraft mc, float range) {
                  LivingEntity best = null; double bestDist = range;
                  for (Entity e : mc.level.entitiesForRendering()) {
                      if (e == mc.player || !(e instanceof LivingEntity) || !e.isAlive()) continue;
                      double dist = mc.player.distanceTo(e);
                      if (dist <= bestDist) { bestDist = dist; best = (LivingEntity) e; }
                  }
                  return best;
              }

              private static float[] getRotations(LivingEntity p, LivingEntity t) {
                  Vec3 eye = p.getEyePosition(); Vec3 target = t.position().add(0, t.getBbHeight() * 0.5, 0);
                  double dx = target.x - eye.x, dy = target.y - eye.y, dz = target.z - eye.z, dist = Math.sqrt(dx * dx + dz * dz);
                  return new float[]{(float)(Math.atan2(dz, dx) * 180.0 / Math.PI) - 90.0F, (float)(-(Math.atan2(dy, dist) * 180.0 / Math.PI))};
              }

              private static void playSound(Minecraft mc, boolean state) {
                  if (mc.player != null) mc.player.playSound(state ? SoundEvents.EXPERIENCE_ORB_PICKUP : SoundEvents.NOTE_BLOCK_BASS.value(), 1.0f, 1.0f);
              }

              private static void restoreKeys(Minecraft c) {
                  long w = c.getWindow().getWindow();
                  c.options.keyUp.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyUp.saveString()).getValue()));
                  c.options.keyDown.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keyDown.saveString()).getValue()));
                  c.options.keySprint.setDown(InputConstants.isKeyDown(w, InputConstants.getKey(c.options.keySprint.saveString()).getValue()));
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: gotoviy-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
